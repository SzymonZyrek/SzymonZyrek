name: Build CV PDF

on:
  push:
    paths:
      - "cv/Szymon_Zyrek_CV.html"
      - "cv/styles.css"
      - "cv/build.sh"
      - "cv/requirements.txt"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cv/requirements.txt

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter ghostscript poppler-utils
          python -m pip install --disable-pip-version-check -r cv/requirements.txt

      - name: Build and verify CV
        run: bash cv/build.sh

      - name: Commit generated PDF
        run: |
          if git diff --quiet -- Szymon_Zyrek_CV.pdf; then
            echo "PDF already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Szymon_Zyrek_CV.pdf
          git commit -m "Regenerate CV PDF"
          git push
