name: Build CV PDF

on:
  push:
    paths:
      - "cv/Szymon_Zyrek_CV.html"
      - "cv/Szymon_Zyrek_CV_Senior.html"
      - "cv/Szymon_Zyrek_CV_Agentic.html"
      - "cv/variants.css"
      - "cv/build-variants.sh"
      - "cv/styles.css"
      - "cv/build.sh"
      - "cv/requirements.txt"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cv/requirements.txt

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter ghostscript poppler-utils
          python -m pip install --disable-pip-version-check -r cv/requirements.txt

      - name: Build and verify CV
        run: bash cv/build.sh

      - name: Upload generated role-targeted PDFs
        uses: actions/upload-artifact@v4
        with:
          name: role-targeted-cvs
          retention-days: 90
          if-no-files-found: error
          path: |
            Szymon_Zyrek_CV_Senior.pdf
            Szymon_Zyrek_CV_Agentic.pdf

      - name: Publish stable CV downloads from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets are allowed without pushing generated binaries to protected branches.
          if ! gh release view cv-latest >/dev/null 2>&1; then
            gh release create cv-latest --target "$GITHUB_SHA" --title "CV — current targeted variants" --notes "Generated from checked-in HTML/CSS with WeasyPrint and Ghostscript. The original profile CV is unchanged."
          fi
          gh release upload cv-latest Szymon_Zyrek_CV_Senior.pdf Szymon_Zyrek_CV_Agentic.pdf --clobber
