name: Build CV PDF

on:
  push:
    paths:
      - "cv/Szymon_Zyrek_CV.html"
      - "cv/Szymon_Zyrek_CV_Senior.html"
      - "cv/Szymon_Zyrek_CV_Agentic.html"
      - "cv/variants.css"
      - "cv/build-variants.sh"
      - "cv/styles.css"
      - "cv/build.sh"
      - "cv/requirements.txt"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cv/requirements.txt

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter ghostscript poppler-utils
          python -m pip install --disable-pip-version-check -r cv/requirements.txt

      - name: Build and verify CV
        run: bash cv/build.sh

      - name: Publish generated role-targeted PDFs
        run: |
          # Preserve the existing public CV PDF exactly as committed.
          git add Szymon_Zyrek_CV_Senior.pdf Szymon_Zyrek_CV_Agentic.pdf
          if git diff --cached --quiet; then
            echo "Role-targeted PDFs already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate role-targeted CV PDFs"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
