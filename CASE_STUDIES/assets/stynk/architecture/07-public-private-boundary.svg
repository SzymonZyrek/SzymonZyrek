<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="780" fill="#10243E" text-anchor="start">Stynk CRM — public website and CRM share infrastructure, not trust</text><text x="40" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#687B96" text-anchor="start">One nginx edge serves both products; public exposure is explicit and private CRM data remains permission-checked.</text><rect x="40" y="112" width="1520" height="50" rx="13" fill="#FFFFFF" stroke="#D8E3EF" stroke-width="1.1"/><text x="58" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#E64B5D" text-anchor="start">TRUST BOUNDARY</text><text x="185" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="620" fill="#10243E" text-anchor="start">share deployment infrastructure, not application trust or data visibility</text><rect x="55" y="195" width="1490" height="92" rx="17" fill="#FFFFFF" stroke="#E64B5D" stroke-width="1.4"/><text x="80" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#E64B5D" text-anchor="start">nginx edge</text><text x="215" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#10243E" text-anchor="start">TLS · hostname routing · security headers · upload limits · public-form rate limiting</text><text x="215" y="257" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#687B96" text-anchor="start">The edge determines which host can reach which application surface.</text><rect x="55" y="325" width="710" height="430" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.5"/><text x="80" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#2F7BF6" text-anchor="start">stynk.eu — public lane</text><text x="80" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#687B96" text-anchor="start">Public access is granted surface by surface.</text><rect x="80" y="435" width="650" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="98" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">Static website</text><text x="710" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">public frontend</text><rect x="80" y="490" width="650" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="98" y="519" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">Contact / inquiry</text><text x="710" y="519" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">validated public input</text><rect x="80" y="545" width="650" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="98" y="574" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">Regions / options</text><text x="710" y="574" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">reviewed public config</text><rect x="80" y="600" width="650" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="98" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">Public realizations</text><text x="710" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">reviewed records</text><rect x="80" y="655" width="650" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="98" y="684" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">Derived public media</text><text x="710" y="684" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">public-only artifacts</text><rect x="80" y="715" width="210" height="30" rx="15" fill="#FFF0F2" stroke="#E64B5D" stroke-width="1.2"/><text x="185" y="735" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#E64B5D" text-anchor="middle">EXPLICIT PUBLIC ALLOWLIST</text><rect x="795" y="325" width="750" height="430" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.5"/><text x="820" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#2F7BF6" text-anchor="start">CRM host — authenticated lane</text><text x="820" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#687B96" text-anchor="start">Full application access is filtered by identity, role and object.</text><rect x="820" y="435" width="690" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="838" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">Angular SPA</text><text x="1490" y="464" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">session auth + CSRF</text><rect x="820" y="490" width="690" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="838" y="519" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">DRF API</text><text x="1490" y="519" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">role + object permissions</text><rect x="820" y="545" width="690" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="838" y="574" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">Financial / role data</text><text x="1490" y="574" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">filtered to caller</text><rect x="820" y="600" width="690" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="838" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">Attachments</text><text x="1490" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">permission-checked delivery</text><rect x="820" y="655" width="690" height="46" rx="10" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="0.9"/><text x="838" y="684" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10243E" text-anchor="start">Admin / audit</text><text x="1490" y="684" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">privileged actions recorded</text><rect x="820" y="715" width="170" height="30" rx="15" fill="#FFF0F2" stroke="#E64B5D" stroke-width="1.2"/><text x="905" y="735" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#E64B5D" text-anchor="middle">PRIVATE BY DEFAULT</text><line x1="780" y1="315" x2="780" y2="765" stroke="#E64B5D" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="40" y="812" width="1520" height="42" rx="12" fill="#10243E"/><text x="60" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#FFFFFF" text-anchor="start">Shared infrastructure, separate trust</text><text x="358.8" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="450" fill="#E8EFF7" text-anchor="start">public by explicit allowlist · private by default · private attachments never become generic static media</text><circle cx="45" cy="877" r="4" fill="#2F7BF6"/><text x="55" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">APP / FLOW</text><circle cx="230" cy="877" r="4" fill="#0FA978"/><text x="240" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">DURABLE STATE</text><circle cx="435" cy="877" r="4" fill="#6F56E8"/><text x="445" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">MODEL / RUNTIME</text><circle cx="620" cy="877" r="4" fill="#F08A00"/><text x="630" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">ASYNC / EXTERNAL</text><circle cx="805" cy="877" r="4" fill="#E64B5D"/><text x="815" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">TRUST / SECURITY</text></svg>