<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="760" fill="#10243E" text-anchor="start">Stynk CRM — public website and CRM share infrastructure, not trust</text><text x="40" y="94" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#657895" text-anchor="start">One nginx edge serves both products while public exposure is explicitly allowlisted and private CRM data stays</text><text x="40" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#657895" text-anchor="start">permission-checked.</text><rect x="40" y="115" width="1520" height="54" rx="14" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.2"/><text x="60" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#E64B5D" text-anchor="start">SECURITY BOUNDARY</text><text x="180" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#10243E" text-anchor="start">reuse infrastructure where it is safe; expose application data only through reviewed public surfaces</text><rect x="55" y="205" width="1490" height="92" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.5"/><text x="80" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#2F7BF6" text-anchor="start">nginx edge</text><text x="210" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="560" fill="#10243E" text-anchor="start">TLS · hostname routing · security headers · upload limits · public-form rate limiting</text><text x="210" y="268" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="start">The edge decides which host may reach which application surface.</text><rect x="55" y="335" width="710" height="395" rx="18" fill="#FFFFFF" stroke="#10A979" stroke-width="1.5"/><text x="80" y="372" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="760" fill="#10A979" text-anchor="start">stynk.eu — public lane</text><text x="80" y="400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">Default closed; selected surfaces are opened deliberately.</text><rect x="80" y="445" width="650" height="42" rx="11" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="98" y="471" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">Static website</text><text x="710" y="471" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">built public frontend</text><rect x="80" y="497" width="650" height="42" rx="11" fill="#EAF9F4" stroke="#10A979" stroke-width="1"/><text x="98" y="523" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">Contact / inquiry</text><text x="710" y="523" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">validated public input</text><rect x="80" y="549" width="650" height="42" rx="11" fill="#E8F7F8" stroke="#128C96" stroke-width="1"/><text x="98" y="575" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">Sales regions / options</text><text x="710" y="575" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">reviewed public configuration</text><rect x="80" y="601" width="650" height="42" rx="11" fill="#FFF3E4" stroke="#F08A00" stroke-width="1"/><text x="98" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">Public realizations</text><text x="710" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">reviewed records only</text><rect x="80" y="653" width="650" height="42" rx="11" fill="#EEF3F8" stroke="#5D7189" stroke-width="1"/><text x="98" y="679" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">Derived public media</text><text x="710" y="679" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">separate public artifact path</text><rect x="80" y="700" width="230" height="30" rx="15" fill="#EAF9F4" stroke="#10A979" stroke-width="1.5"/><text x="195" y="720" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#10A979" text-anchor="middle">PUBLIC BY EXPLICIT ALLOWLIST</text><rect x="795" y="335" width="750" height="395" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.5"/><text x="820" y="372" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="760" fill="#2F7BF6" text-anchor="start">CRM host — authenticated lane</text><text x="820" y="400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">Full business application, protected at session, role and object level.</text><rect x="820" y="445" width="690" height="42" rx="11" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="838" y="471" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">Angular SPA</text><text x="1490" y="471" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">session auth + CSRF</text><rect x="820" y="497" width="690" height="42" rx="11" fill="#F1EEFF" stroke="#6E56E8" stroke-width="1"/><text x="838" y="523" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">DRF API</text><text x="1490" y="523" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">role + object-level authorization</text><rect x="820" y="549" width="690" height="42" rx="11" fill="#FFF3E4" stroke="#F08A00" stroke-width="1"/><text x="838" y="575" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">Financial / role data</text><text x="1490" y="575" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">filtered to the caller</text><rect x="820" y="601" width="690" height="42" rx="11" fill="#FFF0F2" stroke="#E64B5D" stroke-width="1"/><text x="838" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">Attachments</text><text x="1490" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">permission-checked Django delivery</text><rect x="820" y="653" width="690" height="42" rx="11" fill="#EAF9F4" stroke="#10A979" stroke-width="1"/><text x="838" y="679" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#10243E" text-anchor="start">Audit / admin actions</text><text x="1490" y="679" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#657895" text-anchor="end">privileged operations recorded</text><rect x="820" y="700" width="180" height="30" rx="15" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.5"/><text x="910" y="720" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2F7BF6" text-anchor="middle">PRIVATE BY DEFAULT</text><line x1="780" y1="330" x2="780" y2="735" stroke="#D9E3EF" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="40" y="832" width="1520" height="48" rx="14" fill="#10243E"/><text x="60" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#FFFFFF" text-anchor="start">Shared infrastructure, separate trust</text><text x="195" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#E7EEF7" text-anchor="start">public by explicit allowlist · private by default · private attachments never become generic static media</text></svg>