<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="210" fill="#163B63" opacity="0.14"/><circle cx="170" cy="860" r="260" fill="#3D2A6D" opacity="0.10"/>
<text x="80" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="750" fill="#F4F7FB" text-anchor="start">Pricing without losing history</text><text x="80" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="450" fill="#9FB0C8" text-anchor="start">Pricing is both executable policy and contractual evidence, so configuration must be versioned and pinned</text><text x="1515" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">05</text>
<line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><rect x="70" y="200" width="300" height="165" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="200" width="7" height="165" rx="4" fill="#34D399"/><text x="98" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Published catalog</text><text x="98" y="272" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">immutable model + rates</text><text x="98" y="299" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">historical pricing context</text><line x1="370" y1="282" x2="460" y2="282" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="460" y="195" width="280" height="175" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="460" y="195" width="7" height="175" rx="4" fill="#A78BFA"/><text x="488" y="237" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">New Job</text><text x="488" y="267" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">pins catalog revision</text><text x="488" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">pins concrete model</text><text x="488" y="321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">stores runtime values</text><line x1="740" y1="282" x2="830" y2="282" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="830" y="185" width="330" height="195" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="830" y="185" width="7" height="195" rx="4" fill="#A78BFA"/><text x="858" y="227" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Canonical pricing</text><text x="858" y="257" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">dispatch price() interface</text><text x="858" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">graph computes outputs</text><text x="858" y="311" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">no legacy fallback</text><line x1="1160" y1="282" x2="1250" y2="282" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1250" y="200" width="270" height="165" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1250" y="200" width="7" height="165" rx="4" fill="#34D399"/><text x="1278" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Price snapshot</text><text x="1278" y="272" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">total + breakdown</text><text x="1278" y="299" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">model/catalog refs</text><text x="1278" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">persisted result</text><rect x="70" y="445" width="300" height="145" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="445" width="7" height="145" rx="4" fill="#FB7185"/><text x="98" y="487" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Historical Job</text><text x="98" y="517" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">existing price retained</text><text x="98" y="544" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">LEGACY_PRESERVED</text><text x="98" y="571" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">never auto-repriced</text><line x1="370" y1="518" x2="480" y2="518" stroke="#FB7185" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="480" y="435" width="360" height="165" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="480" y="435" width="7" height="165" rx="4" fill="#FB7185"/><text x="508" y="477" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Compatibility lane</text><text x="508" y="507" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">historical / dynamic-v1 catalogs</text><text x="508" y="534" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">explicit old rule execution</text><text x="508" y="561" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">no payload rewriting</text><line x1="840" y1="518" x2="950" y2="518" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="950" y="445" width="570" height="145" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="950" y="445" width="7" height="145" rx="4" fill="#34D399"/><text x="978" y="487" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Safety invariant</text><text x="978" y="517" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">canonical failure is explicit · history stays readable</text><text x="978" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">published catalogs and stored snapshots are never reinterpreted</text><rect x="70" y="650" width="1450" height="150" rx="20" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="70" y="650" width="7" height="150" rx="4" fill="#34D399"/><text x="96" y="681" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#34D399" text-anchor="start">ARCHITECTURAL DECISION</text><text x="96" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">Pin every Job to the semantics that priced it</text><text x="96" y="741" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">WHY</text><text x="807" y="741" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">CONSEQUENCE</text><text x="96" y="766" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">a later catalog or model change must not alter what an older agreement meant</text><text x="807" y="766" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">new policy can evolve safely while historical prices remain reproducible and</text><text x="807" y="788" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">auditable</text><text x="80" y="861" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="857" r="5" fill="#4FD1C5"/><text x="711" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="825" cy="857" r="5" fill="#A78BFA"/><text x="836" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="950" cy="857" r="5" fill="#34D399"/><text x="961" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1095" cy="857" r="5" fill="#FBBF24"/><text x="1106" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1220" cy="857" r="5" fill="#60A5FA"/><text x="1231" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1345" cy="857" r="5" fill="#FB7185"/><text x="1356" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>