<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="220" fill="#163B63" opacity="0.12"/><circle cx="180" cy="850" r="250" fill="#3D2A6D" opacity="0.08"/><text x="80" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="760" fill="#F4F7FB" text-anchor="start">Pricing may evolve. A historical Job must not change meaning.</text><text x="80" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">Executable pricing policy is versioned because price history is both a result and evidence of the semantics that</text><text x="80" y="137" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">produced it.</text><text x="1518" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">05</text><line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><text x="70" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">TWO TIMELINES, ONE INVARIANT</text><rect x="90" y="220" width="155" height="30" rx="15" fill="#A78BFA" opacity="0.14" stroke="#A78BFA" stroke-width="1.5"/><text x="167.5" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">NEW SEMANTICS</text><rect x="90" y="300" width="230" height="82" rx="16" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="205" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">Published catalog</text><line x1="320" y1="341" x2="348" y2="341" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="360" y="300" width="230" height="82" rx="16" fill="#14233A" stroke="#A78BFA" stroke-width="2"/><text x="475" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">New Job</text><line x1="590" y1="341" x2="598" y2="341" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="610" y="300" width="240" height="82" rx="16" fill="#14233A" stroke="#A78BFA" stroke-width="2"/><text x="730" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">Canonical pricing</text><line x1="850" y1="341" x2="898" y2="341" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="910" y="300" width="250" height="82" rx="16" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="1035" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">Price snapshot</text><rect x="1200" y="275" width="320" height="135" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1200" y="275" width="7" height="135" rx="4" fill="#FB7185"/><text x="1230" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#FB7185" text-anchor="start">NO SILENT FALLBACK</text><text x="1230" y="342" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#F4F7FB" text-anchor="start">If canonical binding/graph is</text><text x="1230" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#F4F7FB" text-anchor="start">invalid, fail explicitly. Do not</text><text x="1230" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#F4F7FB" text-anchor="start">price with legacy semantics.</text><rect x="90" y="455" width="190" height="30" rx="15" fill="#FB7185" opacity="0.14" stroke="#FB7185" stroke-width="1.5"/><text x="185" y="475" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#FB7185" text-anchor="middle">HISTORICAL SEMANTICS</text><rect x="90" y="535" width="255" height="82" rx="16" fill="#14233A" stroke="#FB7185" stroke-width="2"/><text x="217.5" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">Historical Job</text><line x1="345" y1="576" x2="388" y2="576" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="400" y="535" width="320" height="82" rx="16" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="560" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">Pinned catalog / revision</text><line x1="720" y1="576" x2="773" y2="576" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="785" y="535" width="320" height="82" rx="16" fill="#14233A" stroke="#FB7185" stroke-width="2"/><text x="945" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">Explicit compatibility reader</text><line x1="1105" y1="576" x2="1158" y2="576" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1170" y="535" width="300" height="82" rx="16" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="1320" y="569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">Stored snapshot remains</text><text x="1320" y="589" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">evidence</text><rect x="70" y="665" width="900" height="125" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="665" width="7" height="125" rx="4" fill="#34D399"/><text x="100" y="700" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#34D399" text-anchor="start">INVARIANT</text><text x="100" y="740" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="730" fill="#F4F7FB" text-anchor="start">New code may evolve; old business meaning may not.</text><text x="100" y="772" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="start">Published catalogs are immutable; historical Jobs are not silently</text><text x="100" y="792" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="start">re-priced.</text><rect x="1010" y="665" width="510" height="125" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1010" y="665" width="7" height="125" rx="4" fill="#A78BFA"/><text x="1040" y="700" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#A78BFA" text-anchor="start">TYPE HONESTY</text><text x="1040" y="735" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">Operation self</text><text x="1170" y="735" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#9FB0C8" text-anchor="start">+</text><text x="1200" y="735" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#4FD1C5" text-anchor="start">typed pricing_context</text><text x="1390" y="735" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">→ price()</text><text x="1040" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="start">Parent Job, constants and VAT context stay explicit instead</text><text x="1040" y="787" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="start">of being injected as undeclared receiver fields.</text><text x="80" y="864" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="858" r="5" fill="#4FD1C5"/><text x="711" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="830" cy="858" r="5" fill="#A78BFA"/><text x="841" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="960" cy="858" r="5" fill="#34D399"/><text x="971" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1110" cy="858" r="5" fill="#FBBF24"/><text x="1121" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1240" cy="858" r="5" fill="#60A5FA"/><text x="1251" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1370" cy="858" r="5" fill="#FB7185"/><text x="1381" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>