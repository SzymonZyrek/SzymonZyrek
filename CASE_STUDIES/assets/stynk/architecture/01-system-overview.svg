<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="220" fill="#163B63" opacity="0.12"/><circle cx="180" cy="850" r="250" fill="#3D2A6D" opacity="0.08"/><text x="80" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="760" fill="#F4F7FB" text-anchor="start">One coherent application. Boundaries where failure semantics change.</text><text x="80" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">The system stays together where consistency matters and separates only where a different responsibility earns a</text><text x="80" y="137" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">boundary.</text><text x="1518" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">01</text><line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><text x="70" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">RESPONSIBILITY CHAIN</text><rect x="70" y="205" width="920" height="130" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="205" width="7" height="130" rx="4" fill="#4FD1C5"/><text x="100" y="243" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F4F7FB" text-anchor="start">User surfaces</text><text x="100" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#9FB0C8" text-anchor="start">Angular SPA + mobile workflows</text><rect x="70" y="355" width="920" height="120" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="355" width="7" height="120" rx="4" fill="#60A5FA"/><text x="100" y="393" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F4F7FB" text-anchor="start">Edge boundary</text><text x="100" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#9FB0C8" text-anchor="start">nginx · TLS · routing · public API allowlist</text><rect x="70" y="495" width="920" height="135" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="495" width="7" height="135" rx="4" fill="#A78BFA"/><text x="100" y="533" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F4F7FB" text-anchor="start">Application consistency boundary</text><text x="100" y="564" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#9FB0C8" text-anchor="start">Django/DRF modular monolith · permissions · lifecycle</text><rect x="70" y="650" width="920" height="115" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="650" width="7" height="115" rx="4" fill="#34D399"/><text x="100" y="688" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F4F7FB" text-anchor="start">Durable truth</text><text x="100" y="719" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#9FB0C8" text-anchor="start">PostgreSQL · business state · audit · durable work</text><line x1="530" y1="335" x2="530" y2="345" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="530" y1="475" x2="530" y2="485" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="530" y1="630" x2="530" y2="640" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1030" y="205" width="490" height="380" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1030" y="205" width="7" height="380" rx="4" fill="#FBBF24"/><rect x="1060" y="230" width="190" height="30" rx="15" fill="#FBBF24" opacity="0.14" stroke="#FBBF24" stroke-width="1.5"/><text x="1155" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">SEPARATE FAILURE MODE</text><text x="1060" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="730" fill="#F4F7FB" text-anchor="start">Async execution</text><text x="1060" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#9FB0C8" text-anchor="start">Business intent is committed first;</text><text x="1060" y="347" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#9FB0C8" text-anchor="start">execution leaves the request path</text><text x="1060" y="369" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="450" fill="#9FB0C8" text-anchor="start">afterwards.</text><rect x="1060" y="405" width="95" height="70" rx="14" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="1107.5" y="434" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#F4F7FB" text-anchor="middle">DomainWorkItem</text><line x1="1155" y1="440" x2="1170" y2="440" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1180" y="405" width="95" height="70" rx="14" fill="#14233A" stroke="#60A5FA" stroke-width="2"/><text x="1227.5" y="434" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#F4F7FB" text-anchor="middle">Redis</text><line x1="1275" y1="440" x2="1278" y2="440" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1288" y="405" width="95" height="70" rx="14" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="1335.5" y="434" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#F4F7FB" text-anchor="middle">Workers</text><line x1="1383" y1="440" x2="1390" y2="440" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1400" y="405" width="95" height="70" rx="14" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="1447.5" y="434" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#F4F7FB" text-anchor="middle">External</text><text x="1447.5" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#F4F7FB" text-anchor="middle">effect</text><text x="1060" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">Split out only where truth ownership, security</text><text x="1060" y="536" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">exposure or failure semantics actually change.</text><rect x="70" y="790" width="1450" height="50" rx="14" fill="#14233A" stroke="#29415F" stroke-width="2"/><text x="95" y="822" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#A78BFA" text-anchor="start">DECISION</text><text x="175" y="822" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#F4F7FB" text-anchor="start">Keep tightly coupled business state together; isolate genuinely different failure modes.</text><text x="80" y="864" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="858" r="5" fill="#4FD1C5"/><text x="711" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="830" cy="858" r="5" fill="#A78BFA"/><text x="841" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="960" cy="858" r="5" fill="#34D399"/><text x="971" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1110" cy="858" r="5" fill="#FBBF24"/><text x="1121" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1240" cy="858" r="5" fill="#60A5FA"/><text x="1251" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1370" cy="858" r="5" fill="#FB7185"/><text x="1381" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>