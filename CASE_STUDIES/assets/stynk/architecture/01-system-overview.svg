<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="210" fill="#163B63" opacity="0.14"/><circle cx="170" cy="860" r="260" fill="#3D2A6D" opacity="0.10"/>
<text x="80" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="750" fill="#F4F7FB" text-anchor="start">System at a glance</text><text x="80" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="450" fill="#9FB0C8" text-anchor="start">One deployable system; boundaries are introduced where failure modes or responsibilities differ</text><text x="1515" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">01</text>
<line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><rect x="70" y="210" width="240" height="140" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="210" width="7" height="140" rx="4" fill="#4FD1C5"/><text x="98" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Browser / mobile</text><text x="98" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">role-specific UX</text><text x="98" y="309" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">field + office workflows</text><line x1="310" y1="280" x2="390" y2="280" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="390" y="200" width="225" height="160" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="390" y="200" width="7" height="160" rx="4" fill="#60A5FA"/><text x="418" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">nginx</text><text x="418" y="272" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">TLS + static assets</text><text x="418" y="299" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">host routing</text><text x="418" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">public API allowlist</text><line x1="615" y1="280" x2="700" y2="280" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="700" y="185" width="360" height="190" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="700" y="185" width="7" height="190" rx="4" fill="#A78BFA"/><text x="728" y="227" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Django + DRF</text><text x="728" y="257" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">modular monolith</text><text x="728" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">thin API → domain services</text><text x="728" y="311" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">permissions + lifecycle</text><line x1="880" y1="375" x2="880" y2="455" stroke="#34D399" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="710" y="465" width="340" height="145" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="710" y="465" width="7" height="145" rx="4" fill="#34D399"/><text x="738" y="507" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">PostgreSQL</text><text x="738" y="537" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">business truth</text><text x="738" y="564" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">audit + durable work</text><text x="738" y="591" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">versioned configuration</text><line x1="1060" y1="245" x2="1140" y2="245" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1140" y="185" width="380" height="150" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1140" y="185" width="7" height="150" rx="4" fill="#4FD1C5"/><text x="1168" y="227" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Angular SPA</text><text x="1168" y="257" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">CRM workspace</text><text x="1168" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">Studio / admin UI</text><line x1="1060" y1="315" x2="1140" y2="410" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1140" y="380" width="380" height="150" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1140" y="380" width="7" height="150" rx="4" fill="#34D399"/><text x="1168" y="422" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Managed files</text><text x="1168" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">scans / photos / documents</text><text x="1168" y="479" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">permission-aware reads</text><rect x="70" y="445" width="530" height="165" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="445" width="7" height="165" rx="4" fill="#FBBF24"/><text x="98" y="487" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Background execution</text><text x="98" y="517" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">durable outbox → broker</text><text x="98" y="544" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">normal + isolated OCR/AI workers</text><text x="98" y="571" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">Beat reconciliation after failures</text><line x1="700" y1="320" x2="600" y2="500" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="660" width="1450" height="145" rx="20" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="70" y="660" width="7" height="145" rx="4" fill="#A78BFA"/><text x="96" y="691" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#A78BFA" text-anchor="start">ARCHITECTURAL DECISION</text><text x="96" y="720" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">Keep the product a modular monolith</text><text x="96" y="751" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">WHY</text><text x="807" y="751" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">CONSEQUENCE</text><text x="96" y="776" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">one owner, one transactional domain, modest operational scale</text><text x="807" y="776" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">simpler deploy/debug/rollback; internal modules stay explicit and async is</text><text x="807" y="798" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">used only where it earns its cost</text><text x="80" y="861" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="857" r="5" fill="#4FD1C5"/><text x="711" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="825" cy="857" r="5" fill="#A78BFA"/><text x="836" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="950" cy="857" r="5" fill="#34D399"/><text x="961" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1095" cy="857" r="5" fill="#FBBF24"/><text x="1106" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1220" cy="857" r="5" fill="#60A5FA"/><text x="1231" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1345" cy="857" r="5" fill="#FB7185"/><text x="1356" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>