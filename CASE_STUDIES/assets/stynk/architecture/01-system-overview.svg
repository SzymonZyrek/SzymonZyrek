ular SPA</text><text x="1260" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#9FB0C8" text-anchor="start">CRM workspace</text><text x="1260" y="307.7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#9FB0C8" text-anchor="start">Studio / admin UI</text><line x1="1150" y1="355" x2="1230" y2="435" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1230" y="390" width="290" height="145" rx="24" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1230" y="390" width="8" height="145" rx="4" fill="#60A5FA"/><text x="1260" y="436" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="650" fill="#F4F7FB" text-anchor="start">Managed files</text><text x="1260" y="468" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#9FB0C8" text-anchor="start">scans / photos / docs</text><text x="1260" y="497.7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#9FB0C8" text-anchor="start">permission-aware reads</text><rect x="80" y="510" width="530" height="190" rx="24" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="80" y="510" width="8" height="190" rx="4" fill="#FB7185"/><text x="110" y="556" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="650" fill="#F4F7FB" text-anchor="start">Async execution</text><text x="110" y="588" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#9FB0C8" text-anchor="start">DomainWorkItem outbox → Redis broker</text><text x="110" y="617.7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#9FB0C8" text-anchor="start">normal worker + isolated OCR/AI worker</text><text x="110" y="647.4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#9FB0C8" text-anchor="start">Celery Beat reconciles durable work</text><l