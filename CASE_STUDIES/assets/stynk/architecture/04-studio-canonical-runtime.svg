233A" stroke="#29415F" stroke-width="2"/><rect x="70" y="705" width="7" height="120" rx="4" fill="#A78BFA"/><text x="96" y="736" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#A78BFA" text-anchor="start">ARCHITECTURAL DECISION</text><text x="96" y="765" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">Generalise the changing business model, not the whole application</text><text x="96" y="796" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">WHY</text><text x="807" y="796" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">CONSEQUENCE</text><text x="96" y="821" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">service shapes and pricing rules accumulated many variants and special cases</text><text x="807" y="821" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">future domain variation becomes versioned configuration while Stynk-specific</text><text x="807" y="843" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">workflows remain ordinary application code</text><text x="80" y="861" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="857" r="5" fill="#4FD1C5"/><text x="711" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="825" cy="857" r="5" fill="#A78BFA"/><text x="836" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="950" 