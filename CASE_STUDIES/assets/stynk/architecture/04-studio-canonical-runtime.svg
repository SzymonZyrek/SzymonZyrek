<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="220" fill="#163B63" opacity="0.12"/><circle cx="180" cy="850" r="250" fill="#3D2A6D" opacity="0.08"/><text x="80" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="760" fill="#F4F7FB" text-anchor="start">When variation became the domain, code stopped being the model.</text><text x="80" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">The generalisation targets recurring variability—not every stable CRM workflow.</text><text x="1518" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">04</text><line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><text x="70" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">THE PROBLEM CHANGED</text><rect x="70" y="220" width="410" height="470" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="220" width="7" height="470" rx="4" fill="#FB7185"/><text x="100" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="730" fill="#F4F7FB" text-anchor="start">Before: variation in code</text><circle cx="105" cy="321" r="4" fill="#FB7185"/><text x="122" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">enum-driven service/job types</text><circle cx="105" cy="385" r="4" fill="#FB7185"/><text x="122" y="389" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">special-case fields and forms</text><circle cx="105" cy="449" r="4" fill="#FB7185"/><text x="122" y="453" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">pricing branches</text><circle cx="105" cy="513" r="4" fill="#FB7185"/><text x="122" y="517" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">business meaning duplicated across</text><text x="122" y="538" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">code paths</text><text x="100" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#9FB0C8" text-anchor="start">At some point the repeated special case</text><text x="100" y="623" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#9FB0C8" text-anchor="start">becomes the real domain problem.</text><rect x="540" y="220" width="500" height="470" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="540" y="220" width="7" height="470" rx="4" fill="#A78BFA"/><rect x="665" y="245" width="250" height="30" rx="15" fill="#A78BFA" opacity="0.14" stroke="#A78BFA" stroke-width="1.5"/><text x="790" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">GENERIC PLATFORM KERNEL</text><text x="790" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="740" fill="#F4F7FB" text-anchor="middle">Versioned model + runtime</text><text x="585" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Types / fields</text><text x="995" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="end">Composite · Variant · TypeRef</text><line x1="585" y1="378" x2="995" y2="378" stroke="#203653" stroke-width="1" stroke-linecap="round"/><text x="585" y="425" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Identity / references</text><text x="995" y="425" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="end">stable semantic addressing</text><line x1="585" y1="438" x2="995" y2="438" stroke="#203653" stroke-width="1" stroke-linecap="round"/><text x="585" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Behaviour</text><text x="995" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="end">Interface · Function · Method · Callable</text><line x1="585" y1="498" x2="995" y2="498" stroke="#203653" stroke-width="1" stroke-linecap="round"/><text x="585" y="545" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Revision resolution</text><text x="995" y="545" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="end">ModelRevision · ModelContext</text><line x1="585" y1="558" x2="995" y2="558" stroke="#203653" stroke-width="1" stroke-linecap="round"/><text x="585" y="605" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Execution</text><text x="995" y="605" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="end">typed RuntimeObject + one callable path</text><line x1="585" y1="618" x2="995" y2="618" stroke="#203653" stroke-width="1" stroke-linecap="round"/><rect x="1100" y="220" width="420" height="470" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1100" y="220" width="7" height="470" rx="4" fill="#4FD1C5"/><text x="1130" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="730" fill="#F4F7FB" text-anchor="start">Still Stynk-specific</text><text x="1130" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Job / Operation bindings</text><text x="1130" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">what can act as a Job</text><text x="1130" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Pricing context</text><text x="1130" y="428" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">contract / VAT / parent Job</text><text x="1130" y="481" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">CRM workflows</text><text x="1130" y="506" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">contracts, execution, payments</text><text x="1130" y="559" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="start">Authoring adapters</text><text x="1130" y="584" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">connect generic model to Stynk UX</text><rect x="70" y="730" width="1450" height="90" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="730" width="7" height="90" rx="4" fill="#A78BFA"/><text x="100" y="762" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#A78BFA" text-anchor="start">PROMOTION RULE</text><text x="100" y="795" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#F4F7FB" text-anchor="start">Move semantics into the Platform only after repeated reuse proves they are generic.</text><text x="100" y="818" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#F4F7FB" text-anchor="start">Stynk-only behaviour stays outside the kernel.</text><text x="80" y="864" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="858" r="5" fill="#4FD1C5"/><text x="711" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="830" cy="858" r="5" fill="#A78BFA"/><text x="841" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="960" cy="858" r="5" fill="#34D399"/><text x="971" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1110" cy="858" r="5" fill="#FBBF24"/><text x="1121" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1240" cy="858" r="5" fill="#60A5FA"/><text x="1251" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1370" cy="858" r="5" fill="#FB7185"/><text x="1381" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>