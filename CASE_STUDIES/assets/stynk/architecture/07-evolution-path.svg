<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="220" fill="#163B63" opacity="0.12"/><circle cx="180" cy="850" r="250" fill="#3D2A6D" opacity="0.08"/><text x="80" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="760" fill="#F4F7FB" text-anchor="start">Prove the replacement path before deleting the old one.</text><text x="80" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">A live system is generalised additively: preserve history, prove adoption, then cross an explicit no-downgrade boundary.</text><text x="1518" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">07</text><line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><text x="70" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">MIGRATION AS A SERIES OF GATES</text><rect x="90" y="315" width="260" height="92" rx="16" fill="#14233A" stroke="#FB7185" stroke-width="2"/><text x="220" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">Hard-coded / dynamic-v1</text><line x1="350" y1="361" x2="385" y2="361" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="395" y="315" width="240" height="92" rx="16" fill="#14233A" stroke="#A78BFA" stroke-width="2"/><text x="515" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">Canonical model</text><text x="515" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">available</text><line x1="635" y1="361" x2="670" y2="361" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="680" y="315" width="235" height="92" rx="16" fill="#14233A" stroke="#A78BFA" stroke-width="2"/><text x="797.5" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">Binding path proven</text><line x1="915" y1="361" x2="950" y2="361" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="960" y="315" width="265" height="92" rx="16" fill="#14233A" stroke="#4FD1C5" stroke-width="2"/><text x="1092.5" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">First binding catalog</text><text x="1092.5" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">activated</text><line x1="1225" y1="361" x2="1260" y2="361" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1270" y="315" width="240" height="92" rx="16" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="1390" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="middle">Fix-forward era</text><line x1="1092" y1="235" x2="1092" y2="545" stroke="#FB7185" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><rect x="982" y="205" width="220" height="30" rx="15" fill="#FB7185" opacity="0.14" stroke="#FB7185" stroke-width="1.5"/><text x="1092" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#FB7185" text-anchor="middle">NO-DOWNGRADE BOUNDARY</text><text x="310" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#34D399" text-anchor="middle">Reversible / rollback-friendly</text><text x="1290" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#FBBF24" text-anchor="middle">Fix forward</text><text x="90" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">INVARIANTS THAT SPAN THE MIGRATION</text><rect x="90" y="555" width="1430" height="44" rx="12" fill="#14233A" stroke="#34D399" stroke-width="1.2"/><text x="112" y="583" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#F4F7FB" text-anchor="start">Additive schema first</text><text x="1490" y="583" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">new structures arrive before old readers leave</text><rect x="90" y="605" width="1430" height="44" rx="12" fill="#14233A" stroke="#34D399" stroke-width="1.2"/><text x="112" y="633" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#F4F7FB" text-anchor="start">Published history immutable</text><text x="1490" y="633" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">no in-place rewrite of historical catalogs</text><rect x="90" y="655" width="1430" height="44" rx="12" fill="#14233A" stroke="#A78BFA" stroke-width="1.2"/><text x="112" y="683" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#F4F7FB" text-anchor="start">Conversion all-or-nothing + idempotent</text><text x="1490" y="683" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">blockers write nothing; reruns do not duplicate</text><rect x="90" y="705" width="1430" height="44" rx="12" fill="#14233A" stroke="#A78BFA" stroke-width="1.2"/><text x="112" y="733" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#F4F7FB" text-anchor="start">Preserve semantic identity</text><text x="1490" y="733" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">representation may change without inventing a new concept</text><rect x="90" y="755" width="1430" height="44" rx="12" fill="#14233A" stroke="#FB7185" stroke-width="1.2"/><text x="112" y="783" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#F4F7FB" text-anchor="start">No heuristic invention</text><text x="1490" y="783" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">unknown old semantics are preserved, not guessed</text><text x="80" y="864" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="858" r="5" fill="#4FD1C5"/><text x="711" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="830" cy="858" r="5" fill="#A78BFA"/><text x="841" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="960" cy="858" r="5" fill="#34D399"/><text x="971" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1110" cy="858" r="5" fill="#FBBF24"/><text x="1121" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1240" cy="858" r="5" fill="#60A5FA"/><text x="1251" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1370" cy="858" r="5" fill="#FB7185"/><text x="1381" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>