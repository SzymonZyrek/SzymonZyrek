<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="210" fill="#163B63" opacity="0.14"/><circle cx="170" cy="860" r="260" fill="#3D2A6D" opacity="0.10"/>
<text x="80" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="750" fill="#F4F7FB" text-anchor="start">Evolution without a rewrite</text><text x="80" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="450" fill="#9FB0C8" text-anchor="start">A live production system is being generalised by adding seams first and removing compatibility only after replacement paths exist</text><text x="1515" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">07</text>
<line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><rect x="70" y="220" width="320" height="190" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="220" width="7" height="190" rx="4" fill="#FB7185"/><text x="98" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">1 · Hard-coded CRM</text><text x="98" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">enum-driven Job types</text><text x="98" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">forms + pricing in code</text><line x1="390" y1="315" x2="435" y2="315" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="450" y="220" width="320" height="190" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="450" y="220" width="7" height="190" rx="4" fill="#FBBF24"/><text x="478" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">2 · Configurable v1</text><text x="478" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">dynamic fields</text><text x="478" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">versioned catalogs</text><line x1="770" y1="315" x2="815" y2="315" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="830" y="220" width="320" height="190" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="830" y="220" width="7" height="190" rx="4" fill="#A78BFA"/><text x="858" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">3 · Canonical model</text><text x="858" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">TypeRefs + interfaces</text><text x="858" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">runtime + automation</text><line x1="1150" y1="315" x2="1195" y2="315" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1210" y="220" width="320" height="190" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1210" y="220" width="7" height="190" rx="4" fill="#4FD1C5"/><text x="1238" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">4 · Platform direction</text><text x="1238" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">Stynk as one System</text><text x="1238" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">domain outside kernel</text><text x="70" y="465" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" fill="#9FB0C8" text-anchor="start">Migration invariants</text><rect x="70" y="490" width="700" height="75" rx="16" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="70" y="490" width="6" height="75" rx="3" fill="#34D399"/><text x="95" y="521" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">Additive schema changes</text><text x="330" y="521" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9FB0C8" text-anchor="start">new structures arrive before old ones leave</text><rect x="815" y="490" width="700" height="75" rx="16" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="815" y="490" width="6" height="75" rx="3" fill="#FB7185"/><text x="840" y="521" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">Explicit adapters</text><text x="1075" y="521" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9FB0C8" text-anchor="start">legacy compatibility is named, not hidden</text><rect x="70" y="585" width="700" height="75" rx="16" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="70" y="585" width="6" height="75" rx="3" fill="#34D399"/><text x="95" y="616" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">Pinned revisions</text><text x="330" y="616" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9FB0C8" text-anchor="start">runtime semantics stay deterministic</text><rect x="815" y="585" width="700" height="75" rx="16" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="815" y="585" width="6" height="75" rx="3" fill="#34D399"/><text x="840" y="616" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">Preserved snapshots</text><text x="1075" y="616" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9FB0C8" text-anchor="start">history is never silently re-priced</text><rect x="70" y="700" width="1450" height="125" rx="20" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="70" y="700" width="7" height="125" rx="4" fill="#A78BFA"/><text x="96" y="731" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#A78BFA" text-anchor="start">ARCHITECTURAL DECISION</text><text x="96" y="760" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">Migrate by proving the replacement path before deleting the old one</text><text x="96" y="791" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">WHY</text><text x="807" y="791" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">CONSEQUENCE</text><text x="96" y="816" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">the CRM is already used in production and historical semantics are business</text><text x="96" y="838" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">data</text><text x="807" y="816" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">each step is reversible until a deliberate publish/adoption boundary;</text><text x="807" y="838" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">failures can be fixed forward without a big-bang rewrite</text><text x="80" y="861" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="857" r="5" fill="#4FD1C5"/><text x="711" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="825" cy="857" r="5" fill="#A78BFA"/><text x="836" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="950" cy="857" r="5" fill="#34D399"/><text x="961" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1095" cy="857" r="5" fill="#FBBF24"/><text x="1106" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1220" cy="857" r="5" fill="#60A5FA"/><text x="1231" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1345" cy="857" r="5" fill="#FB7185"/><text x="1356" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>