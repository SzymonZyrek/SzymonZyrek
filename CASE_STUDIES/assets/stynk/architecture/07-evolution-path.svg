ystems</text><rect x="70" y="500" width="330" height="160" rx="24" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="500" width="8" height="160" rx="4" fill="#FB7185"/><text x="100" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">1 · Domain code</text><text x="100" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">enum-driven job types</text><text x="100" y="603.65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">hard-coded forms</text><text x="100" y="629.3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">pricing in application code</text><rect x="425" y="500" width="330" height="160" rx="24" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="425" y="500" width="8" height="160" rx="4" fill="#FBBF24"/><text x="455" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">2 · Dynamic v1</text><text x="455" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">configurable fields</text><text x="455" y="603.65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">versioned catalogs</text><text x="455" y="629.3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">compatibility runtime</text><rect x="780" y="500" width="330" height="160" rx="24" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="780" y="500" width="8" height="160" rx="4" fill="#4FD1C5"/><text x="810" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">3 · Canonical model</text><text x="810" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">TypeRefs + Composites</text><text x="810" y="603.65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">interfaces + callables</text><text x="810" y="629.3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">runtime + automation</text><rect x="1135" y="500" width="385" height="160" rx="24" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1135" y="500" width="8" height="160" rx="4" fill="#34D399"/><text x="1165" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">4 · Platform direction</text><text x="1165" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">Stynk becomes one System</text><text x="1165" y="603.65" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">same primitives can define others</text><text x="1165" y="629.3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#9FB0C8" text-anchor="start">domain stays outside kernel</text><rect x="80" y="735" width="340" height="42" rx="21" fill="#14233A" stroke="#34D399" stroke-width="1.5"/><text x="250" y="763" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#34D399" text-anchor="middle">ADDITIVE MIGRATIONS</text><rect x="440" y="735" width="330" height="42" rx="21" fill="#14233A" stroke="#FBBF24" stroke-width="1.5"/><text x="605" y="763" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#FBBF24" text-anchor="middle">EXPLICIT ADAPTERS</text><rect x="790" y="735" width="350" height="42" rx="21" fill="#14233A" stroke="#60A5FA" stroke-width="1.5"/><text x="965" y="763" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#60A5FA" text-anchor="middle">PINNED REVISIONS</text><rect x="1160" y="735" width="360" height="42" rx="21" fill="#14233A" stroke="#FB7185" stroke-width="1.5"/><text x="1340" y="763" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#FB7185" text-anchor="middle">HISTORY IS NOT REINTERPRETED</text><text x="80" y="858" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text></svg>