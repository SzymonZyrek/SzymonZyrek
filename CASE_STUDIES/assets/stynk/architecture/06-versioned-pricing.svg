fill="#10243E" text-anchor="start">Studio simulation uses the real interpreter without writing a real</text><text x="825" y="631" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="560" fill="#10243E" text-anchor="start">Contract, so authoring feedback and production pricing share the same</text><text x="825" y="652" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="560" fill="#10243E" text-anchor="start">semantics.</text><rect x="825" y="675" width="285" height="30" rx="15" fill="#EAF9F4" stroke="#10A979" stroke-width="1.5"/><text x="967.5" y="695" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#10A979" text-anchor="middle">SAFE CHANGE WITHOUT HISTORICAL REWRITE</text><rect x="40" y="832" width="1520" height="48" rx="14" fill="#10243E"/><text x="60" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#FFFFFF" text-anchor="start">Safe evolution</text><text x="195" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#E7EEF7" text-anchor="start">new rules move forward · old business meaning stays reproducible · users can inspect how a result was produced</text></svg>