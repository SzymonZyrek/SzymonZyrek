="#687B96" text-anchor="end">completion path closes</text><rect x="1087" y="483" width="436" height="44" rx="10" fill="#EAF9F4" stroke="#0FA978" stroke-width="0.9"/><text x="1103" y="509" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="760" fill="#0FA978" text-anchor="start">Commission</text><text x="1510" y="509" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">becomes payable</text><rect x="1087" y="538" width="436" height="44" rx="10" fill="#EAF9F4" stroke="#0FA978" stroke-width="0.9"/><text x="1103" y="564" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="760" fill="#0FA978" text-anchor="start">History</text><text x="1510" y="564" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">final state stays reconstructable</text><rect x="55" y="620" width="1490" height="145" rx="17" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.4"/><text x="80" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#2F7BF6" text-anchor="start">Lifecycle service is the orchestration boundary</text><text x="80" y="686" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">The UI asks for a business transition. The service validates it, applies related state changes</text><text x="80" y="707" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">transactionally and emits the resulting operational effects once.</text><rect x="80" y="724" width="165" height="30" rx="15" fill="#EAF9F4" stroke="#0FA978" stroke-width="1.2"/><text x="162.5" y="744" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#0FA978" text-anchor="middle">Payments</text><rect x="261" y="724" width="165" height="30" rx="15" fill="#EAF2FF" stroke="#2F7BF6" stroke-