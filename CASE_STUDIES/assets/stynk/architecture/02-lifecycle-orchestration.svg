0" cy="455" r="4" fill="#2F7BF6"/><text x="94" y="460" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">create client payment obligations</text><circle cx="80" cy="486" r="4" fill="#2F7BF6"/><text x="94" y="491" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">create sales commission obligations</text><circle cx="80" cy="517" r="4" fill="#2F7BF6"/><text x="94" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">notify Office / Sales</text><circle cx="80" cy="548" r="4" fill="#2F7BF6"/><text x="94" y="553" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">record lifecycle transition</text><rect x="570" y="335" width="460" height="260" rx="18" fill="#FFFFFF" stroke="#F08A00" stroke-width="1.5"/><rect x="590" y="353" width="150" height="30" rx="15" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.5"/><text x="665" y="373" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F08A00" text-anchor="middle">SEMANTIC TRANSITION</text><text x="590" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="740" fill="#10243E" text-anchor="start">First Job actually starts</text><circle cx="595" cy="455" r="4" fill="#F08A00"/><text x="609" y="460" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">Contract execution moves forward</text><circle cx="595" cy="486" r="4" fill="#F08A00"/><text x="609" y="491" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">prepayment gets real due date</text><circle cx="595" cy="517" r="4" fill="#F08A00"/><text x="609" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">team visibility updates</text><circle cx="595" cy="548" r="4" fill="#F08A00"/><text x="609" y="553" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">urgent reminder can be scheduled</text><rect x="1085" y="335" width="460" height="260" rx="18" fill="#FFFFFF" stroke="#10A979" stroke-width="1.5"/><rect x="1105" y="353" width="150" height="30" rx="15" fill="#EAF9F4" stroke="#10A979" stroke-width="1.5"/><text x="1180" y="373" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#10A979" text-anchor="middle">SEMANTIC TRANSITION</text><text x="1105" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="740" fill="#10243E" text-anchor="start">Last Job completes + final payment</text><text x="1105" y="430" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="740" fill="#10243E" text-anchor="start">settles</text><circle cx="1110" cy="455" r="4" fill="#10A979"/><text x="1124" y="460" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">completion path closes</text><circle cx="1110" cy="486" r="4" fill="#10A979"/><text x="1124" y="491" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">final payment consequences resolve</text><circle cx="1110" cy="517" r="4" fill="#10A979"/><text x="1124" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">completion commission becomes payable</text><circle cx="1110" cy="548" r="4" fill="#10A979"/><text x="1124" y="553" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">history and notifications update</text><rect x="55" y="630" width="1490" height="150" rx="18" fill="#FFFFFF" stroke="#6E56E8" stroke-width="1.5"/><text x="80" y="666" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#6E56E8" text-anchor="start">Lifecycle services are the orchestration boundary</text><text x="80" y="697" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="560" fill="#10243E" text-anchor="start">They validate transitions, update multiple models transactionally and emit the related business effects</text><text x="80" y="719" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="560" fill="#10243E" text-anchor="start">once — screens do not reimplement the workflow independently.</text><rect x="80" y="738" width="180" height="30" rx="15" fill="#FFFFFF" stroke="#F08A00" stroke-width="1.1"/><text x="170" y="758" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F08A00" text-anchor="middle">Payments</text><rect x="278" y="738" width="180" height="30" rx="15" fill="#FFFFFF" stroke="#128C96" stroke-width="1.1"/><text x="368" y="758" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#128C96" text-anchor="middle">Planning</text><rect x="476" y="738" width="180" height="30" rx="15" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.1"/><text x="566" y="758" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2F7BF6" text-anchor="middle">Notifications</text><rect x="674" y="738" width="250" height="30" rx="15" fill="#FFFFFF" stroke="#10A979" stroke-width="1.1"/><text x="799" y="758" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#10A979" text-anchor="middle">Materials / equipment</text><rect x="942" y="738" width="180" height="30" rx="15" fill="#FFFFFF" stroke="#E64B5D" stroke-width="1.1"/><text x="1032" y="758" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#E64B5D" text-anchor="middle">Audit</text><rect x="40" y="832" width="1520" height="48" rx="14" fill="#10243E"/><text x="60" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#FFFFFF" text-anchor="start">Design principle</text><text x="195" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#E7EEF7" text-anchor="start">one semantic transition → all related business effects</text></svg>