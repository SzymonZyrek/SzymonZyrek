<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="760" fill="#10243E" text-anchor="start">Stynk CRM — business state drives the workflow</text><text x="40" y="94" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#657895" text-anchor="start">Contract and Job transitions are orchestration points for payments, planning, commissions, notifications and audit.</text><rect x="40" y="115" width="1520" height="54" rx="14" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.2"/><text x="60" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#10A979" text-anchor="start">ARCHITECTURAL IDEA</text><text x="180" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#10243E" text-anchor="start">status changes are semantic events — the service layer owns every related side effect</text><rect x="60" y="215" width="190" height="72" rx="14" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.5"/><text x="155" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#2F7BF6" text-anchor="middle">WITHDRAWABLE</text><line x1="250" y1="251" x2="288" y2="251" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="300" y="215" width="190" height="72" rx="14" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.5"/><text x="395" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#2F7BF6" text-anchor="middle">BINDING</text><line x1="490" y1="251" x2="528" y2="251" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" 