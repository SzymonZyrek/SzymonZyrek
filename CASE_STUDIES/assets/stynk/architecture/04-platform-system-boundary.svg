r="start">Domain semantics stay explicit instead of leaking into the generic kernel.</text><rect x="80" y="645" width="250" height="95" rx="14" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.2"/><text x="95" y="677" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="740" fill="#2F7BF6" text-anchor="start">Job binding</text><text x="95" y="703" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">which Composite is exposed as</text><text x="95" y="720" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">a CRM Job</text><rect x="365" y="645" width="250" height="95" rx="14" fill="#EAF9F4" stroke="#10A979" stroke-width="1.2"/><text x="380" y="677" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="740" fill="#10A979" text-anchor="start">Operation binding</text><text x="380" y="703" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">which Operations a Job allows</text><rect x="650" y="645" width="250" height="95" rx="14" fill="#F1EEFF" stroke="#6E56E8" stroke-width="1.2"/><text x="665" y="677" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="740" fill="#6E56E8" text-anchor="start">Pricing context</text><text x="665" y="703" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">Contract · VAT · parent Job ·</text><text x="665" y="720" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">rates</text><rect x="935" y="645" width="250" height="95" rx="14" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.2"/><text x="950" y="677" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="740" fill="#F08A00" text-anchor="start">CRM lifecycle</text><text x="950" y="703" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">planning · payments ·</text><text x="950" y="720" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">notifications</text><rect x="1220" y="645" width="250" height="95" rx="14" fill="#E8F7F8" stroke="#128C96" stroke-width="1.2"/><text x="1235" y="677" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="740" fill="#128C96" text-anchor="start">Authoring adapters</text><text x="1235" y="703" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">business-friendly Studio</text><text x="1235" y="720" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">surfaces</text><rect x="40" y="832" width="1520" height="48" rx="14" fill="#10243E"/><text x="60" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#FFFFFF" text-anchor="start">Extensibility without domain leakage</text><text x="195" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#E7EEF7" text-anchor="start">generic runtime below · explicit Stynk semantics above · reuse grows only where semantics actually repeat</text></svg>