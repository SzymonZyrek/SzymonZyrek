<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="760" fill="#10243E" text-anchor="start">Stynk CRM — reusable model kernel, explicit business bindings</text><text x="40" y="94" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#657895" text-anchor="start">Generic runtime semantics are shared; Job, Operation and CRM meaning stay visible in the Stynk system layer.</text><rect x="40" y="115" width="1520" height="54" rx="14" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.2"/><text x="60" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#6E56E8" text-anchor="start">SEPARATION OF CONCERNS</text><text x="180" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#10243E" text-anchor="start">generalise reusable semantics below; keep construction-domain roles above</text><rect x="55" y="205" width="1490" height="270" rx="18" fill="#FFFFFF" stroke="#6E56E8" stroke-width="1.5"/><text x="80" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="760" fill="#6E56E8" text-anchor="start">Platform kernel</text><text x="80" y="268" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#657895" text-anchor="start">Reusable semantics that do not know what a roof, contract or subcontractor is.</text><rect x="80" y="310" width="215" height="115" rx="14" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.2"/><text x="96" y="343" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="740" fill="#2F7BF6" text-anchor="start">Type system</text