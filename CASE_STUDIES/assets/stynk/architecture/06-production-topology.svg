h="200" height="95" rx="16" fill="#14233A" stroke="#A78BFA" stroke-width="2"/><text x="870" y="289" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="middle">Django</text><text x="870" y="316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="middle">gunicorn</text><rect x="1010" y="250" width="200" height="95" rx="16" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="1110" y="289" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="middle">PostgreSQL</text><text x="1110" y="316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="middle">business truth</text><rect x="1250" y="250" width="200" height="95" rx="16" fill="#14233A" stroke="#60A5FA" stroke-width="2"/><text x="1350" y="289" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="middle">Redis</text><text x="1350" y="316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="middle">broker</text><rect x="770" y="385" width="200" height="95" rx="16" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="870" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="middle">Celery</text><text x="870" y="451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="middle">normal worker</text><rect x="1010" y="385" width="200" height="95" rx="16" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="1110" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="middle">OCR / AI</text><text x="1110" y="451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="middle">isolated worker</text><rect x="1250" y="385" width="200" height="95" rx="16" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="1350" y="424" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="middle">Celery Beat</text><text x="1350" y="451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="middle">schedules</text><rect x="70" y="410" width="575" height="155" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="410" width="7" height="155" rx="4" fill="#FBBF24"/><text x="98" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Host operations</text><text x="98" y="482" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">systemd supervision + watchdog</text><text x="98" y="507" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">cron backups / certificates / maintenance</text><text x="98" y="532" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">pg_dump + revision metadata</text><rect x="70" y="575" width="275" height="90" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="575" width="7" height="90" rx="4" fill="#FBBF24"/><text x="98" y="617" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#F4F7FB" text-anchor="start">Mail stack</text><text x="98" y="647" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9FB0C8" text-anchor="start">separate host boundary</text><rect x="370" y="575" width="275" height="90" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="370" y="575" width="7" height="90" rx="4" fill="#34D399"/><text x="398" y="617" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" fill="#F4F7FB" text-anchor="start">Backup box</text><text x="398" y="647" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#9FB0C8" text-anchor="start">off-site copy / recovery</text><rect x="70" y="675" width="1450" height="155" rx="20" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="70" y="675" width="7" height="155" rx="4" fill="#FBBF24"/><text x="96" y="706" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#FBBF24" text-anchor="start">ARCHITECTURAL DECISION</text><text x="96" y="735" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">One VPS is a constraint and a feature</text><text x="96" y="766" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">WHY</text><text x="807" y="766" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">CONSEQUENCE</text><text x="96" y="791" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">current load does not justify cluster overhead; solo ownership rewards</text><text x="96" y="813" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">reproducibility</text><text x="807" y="791" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">deployment stays cheap and understandable, while backups/watchdogs live</text><text x="807" y="813" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">outside the app so recovery still works when containers do not</text><text x="80" y="861" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="857" r="5" fill="#4FD1C5"/><text x="711" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="825" cy="857" r="5" fill="#A78BFA"/><text x="836" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="950" cy="857" r="5" fill="#34D399"/><text x="961" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1095" cy="857" r="5" fill="#FBBF24"/><text x="1106" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1220" cy="857" r="5" fill="#60A5FA"/><text x="1231" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1345" cy="857" r="5" fill="#FB7185"/><text x="1356" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>