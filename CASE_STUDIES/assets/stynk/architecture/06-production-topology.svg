<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="220" fill="#163B63" opacity="0.12"/><circle cx="180" cy="850" r="250" fill="#3D2A6D" opacity="0.08"/><text x="80" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="760" fill="#F4F7FB" text-anchor="start">Recovery before redundancy.</text><text x="80" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">Critical recovery mechanisms live outside the application failure domain they must recover.</text><text x="1518" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">06</text><line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><text x="70" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">BLAST RADIUS VS RECOVERY</text><rect x="70" y="220" width="930" height="430" rx="24" fill="#0F1B2D" stroke="#A78BFA" stroke-width="2"/><rect x="95" y="240" width="270" height="30" rx="15" fill="#A78BFA" opacity="0.14" stroke="#A78BFA" stroke-width="1.5"/><text x="230" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">ONE VPS · ONLINE FAILURE DOMAIN</text><rect x="105" y="300" width="250" height="100" rx="16" fill="#14233A" stroke="#60A5FA" stroke-width="2"/><text x="127" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">nginx</text><text x="127" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="start">internet edge</text><rect x="385" y="300" width="250" height="100" rx="16" fill="#14233A" stroke="#A78BFA" stroke-width="2"/><text x="407" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">Django</text><text x="407" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="start">application</text><rect x="665" y="300" width="250" height="100" rx="16" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="687" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">PostgreSQL</text><text x="687" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="start">business truth</text><rect x="105" y="440" width="250" height="100" rx="16" fill="#14233A" stroke="#60A5FA" stroke-width="2"/><text x="127" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">Redis</text><text x="127" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="start">transport</text><rect x="385" y="440" width="250" height="100" rx="16" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="407" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">Celery worker</text><text x="407" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="start">normal async</text><rect x="665" y="440" width="250" height="100" rx="16" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="687" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F7FB" text-anchor="start">OCR / AI worker</text><text x="687" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#9FB0C8" text-anchor="start">isolated async</text><rect x="385" y="565" width="250" height="55" rx="14" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="510" y="599" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" fill="#F4F7FB" text-anchor="middle">Celery Beat · schedules</text><rect x="1040" y="220" width="480" height="430" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1040" y="220" width="7" height="430" rx="4" fill="#34D399"/><text x="1070" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="730" fill="#F4F7FB" text-anchor="start">What survives app failure?</text><rect x="1070" y="297" width="410" height="66" rx="14" fill="#14233A" stroke="#FBBF24" stroke-width="1.5"/><text x="1092" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">systemd / watchdog</text><text x="1455" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">host supervision</text><rect x="1070" y="375" width="410" height="66" rx="14" fill="#14233A" stroke="#34D399" stroke-width="1.5"/><text x="1092" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">pg_dump + off-site copy</text><text x="1455" y="403" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">recovery evidence</text><rect x="1070" y="453" width="410" height="66" rx="14" fill="#14233A" stroke="#FBBF24" stroke-width="1.5"/><text x="1092" y="481" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">cert / OS maintenance</text><text x="1455" y="481" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">host lifecycle</text><rect x="1070" y="531" width="410" height="66" rx="14" fill="#14233A" stroke="#FBBF24" stroke-width="1.5"/><text x="1092" y="559" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">host mail boundary</text><text x="1455" y="559" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">separate service boundary</text><rect x="70" y="690" width="700" height="115" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="690" width="7" height="115" rx="4" fill="#FB7185"/><text x="100" y="725" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#FB7185" text-anchor="start">ACCEPTED LIMIT</text><text x="100" y="760" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#F4F7FB" text-anchor="start">The VPS is a single online failure domain. Backups improve</text><text x="100" y="783" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#F4F7FB" text-anchor="start">recovery, not uninterrupted availability.</text><rect x="810" y="690" width="710" height="115" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="810" y="690" width="7" height="115" rx="4" fill="#60A5FA"/><text x="840" y="725" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#60A5FA" text-anchor="start">CHANGE TRIGGER</text><text x="840" y="760" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#F4F7FB" text-anchor="start">Evolve when tested recovery cannot meet business RTO/RPO, host</text><text x="840" y="781" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#F4F7FB" text-anchor="start">impact becomes unacceptable, or independent scaling solves a</text><text x="840" y="802" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#F4F7FB" text-anchor="start">measured problem.</text><text x="80" y="864" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="858" r="5" fill="#4FD1C5"/><text x="711" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="830" cy="858" r="5" fill="#A78BFA"/><text x="841" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="960" cy="858" r="5" fill="#34D399"/><text x="971" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1110" cy="858" r="5" fill="#FBBF24"/><text x="1121" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1240" cy="858" r="5" fill="#60A5FA"/><text x="1251" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1370" cy="858" r="5" fill="#FB7185"/><text x="1381" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>