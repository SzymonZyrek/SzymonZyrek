<text x="80" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="750" fill="#F4F7FB" text-anchor="start">Production topology</text><text x="80" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="450" fill="#9FB0C8" text-anchor="start">Operational complexity is kept proportional to the company while critical recovery stays outside the app</text><text x="1515" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">06</text>
