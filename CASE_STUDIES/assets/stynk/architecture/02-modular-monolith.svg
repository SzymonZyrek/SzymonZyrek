<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="220" fill="#163B63" opacity="0.12"/><circle cx="180" cy="850" r="250" fill="#3D2A6D" opacity="0.08"/><text x="80" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="760" fill="#F4F7FB" text-anchor="start">Modularity first. Network decomposition after it earns its cost.</text><text x="80" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">Local consistency and explicit internal seams matter more than independent service deployment—until evidence says</text><text x="80" y="137" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">otherwise.</text><text x="1518" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">02</text><line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><text x="70" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">THE DECISION IS ABOUT COUPLING, NOT FASHION</text><rect x="70" y="215" width="430" height="445" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="215" width="7" height="445" rx="4" fill="#34D399"/><text x="100" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="730" fill="#F4F7FB" text-anchor="start">Forces keeping it together</text><circle cx="104" cy="305" r="4" fill="#34D399"/><text x="122" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB" text-anchor="start">Shared transactions</text><text x="122" y="335" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">Contracts, jobs, pricing, payments and audit</text><text x="122" y="355" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">often change together.</text><circle cx="104" cy="387" r="4" fill="#34D399"/><text x="122" y="392" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB" text-anchor="start">One operational owner</text><text x="122" y="417" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">Independent services would add</text><text x="122" y="437" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">infrastructure autonomy without</text><text x="122" y="457" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">organisational autonomy.</text><circle cx="104" cy="469" r="4" fill="#34D399"/><text x="122" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB" text-anchor="start">Local reproduction</text><text x="122" y="499" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">One process + one database keeps failures</text><text x="122" y="519" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">reproducible.</text><circle cx="104" cy="551" r="4" fill="#34D399"/><text x="122" y="556" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#F4F7FB" text-anchor="start">One source of truth</text><text x="122" y="581" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">Cross-domain consistency is currently more</text><text x="122" y="601" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">valuable than isolated deployability.</text><rect x="545" y="245" width="510" height="385" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="545" y="245" width="7" height="385" rx="4" fill="#A78BFA"/><rect x="700" y="270" width="190" height="30" rx="15" fill="#A78BFA" opacity="0.14" stroke="#A78BFA" stroke-width="1.5"/><text x="795" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">CHOSEN TOPOLOGY</text><text x="800" y="330" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="760" fill="#F4F7FB" text-anchor="middle">Modular monolith</text><rect x="650" y="354" width="300" height="46" rx="12" fill="#14233A" stroke="#A78BFA" stroke-width="1.5"/><text x="675" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">API</text><text x="930" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">thin transport layer</text><rect x="650" y="417" width="300" height="46" rx="12" fill="#14233A" stroke="#A78BFA" stroke-width="1.5"/><text x="675" y="445" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">Service layer</text><text x="930" y="445" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">owns business workflows</text><rect x="650" y="480" width="300" height="46" rx="12" fill="#14233A" stroke="#A78BFA" stroke-width="1.5"/><text x="675" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">Domain modules</text><text x="930" y="508" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">explicit internal boundaries</text><rect x="650" y="543" width="300" height="46" rx="12" fill="#14233A" stroke="#34D399" stroke-width="1.5"/><text x="675" y="571" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#F4F7FB" text-anchor="start">PostgreSQL</text><text x="930" y="571" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#9FB0C8" text-anchor="end">local ACID where needed</text><rect x="1100" y="215" width="420" height="445" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1100" y="215" width="7" height="445" rx="4" fill="#60A5FA"/><text x="1130" y="260" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="730" fill="#F4F7FB" text-anchor="start">Extraction earns its cost when…</text><circle cx="1135" cy="311" r="4" fill="#60A5FA"/><text x="1152" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">one domain needs sustained</text><text x="1152" y="336" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">independent scaling</text><circle cx="1135" cy="369" r="4" fill="#60A5FA"/><text x="1152" y="373" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">ownership or release cadence actually</text><text x="1152" y="394" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">separates</text><circle cx="1135" cy="427" r="4" fill="#60A5FA"/><text x="1152" y="431" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">fault/compliance isolation must be</text><text x="1152" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">physical</text><circle cx="1135" cy="485" r="4" fill="#60A5FA"/><text x="1152" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">the shared database becomes limiting</text><text x="1152" y="510" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">coupling</text><circle cx="1135" cy="543" r="4" fill="#60A5FA"/><text x="1152" y="547" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">shared deployment is the measured</text><text x="1152" y="568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#F4F7FB" text-anchor="start">bottleneck</text><rect x="70" y="700" width="1450" height="120" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="700" width="7" height="120" rx="4" fill="#FBBF24"/><text x="100" y="736" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#FBBF24" text-anchor="start">TRADE-OFF</text><text x="100" y="770" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#F4F7FB" text-anchor="start">We accept that process boundaries do not enforce module discipline. Code</text><text x="100" y="793" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#F4F7FB" text-anchor="start">structure, services, tests and review must do that job.</text><text x="965" y="736" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#9FB0C8" text-anchor="start">Rule: network decomposition only after it solves</text><text x="965" y="758" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#9FB0C8" text-anchor="start">a measured problem.</text><text x="80" y="864" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="858" r="5" fill="#4FD1C5"/><text x="711" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="830" cy="858" r="5" fill="#A78BFA"/><text x="841" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="960" cy="858" r="5" fill="#34D399"/><text x="971" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1110" cy="858" r="5" fill="#FBBF24"/><text x="1121" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1240" cy="858" r="5" fill="#60A5FA"/><text x="1251" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1370" cy="858" r="5" fill="#FB7185"/><text x="1381" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>