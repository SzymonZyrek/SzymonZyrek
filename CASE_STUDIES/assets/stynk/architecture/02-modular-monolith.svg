<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="210" fill="#163B63" opacity="0.14"/><circle cx="170" cy="860" r="260" fill="#3D2A6D" opacity="0.10"/>
<text x="80" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="750" fill="#F4F7FB" text-anchor="start">Why a modular monolith?</text><text x="80" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="450" fill="#9FB0C8" text-anchor="start">The decision follows the shape of the problem, not a preference for or against microservices</text><text x="1515" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">02</text>
<line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><rect x="70" y="205" width="440" height="190" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="205" width="7" height="190" rx="4" fill="#A78BFA"/><text x="98" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Forces that favour one process</text><text x="98" y="277" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">cross-domain transactions matter</text><text x="98" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">one engineer owns build + operations</text><text x="98" y="331" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">production scale fits one PostgreSQL node</text><text x="98" y="358" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">fast local reproduction is valuable</text><rect x="580" y="205" width="440" height="190" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="580" y="205" width="7" height="190" rx="4" fill="#A78BFA"/><text x="608" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">Boundaries still matter</text><text x="608" y="277" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">Django apps by domain responsibility</text><text x="608" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">service layer owns business workflows</text><text x="608" y="331" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">API stays thin</text><text x="608" y="358" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">async / external work has explicit seams</text><rect x="1090" y="205" width="430" height="190" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1090" y="205" width="7" height="190" rx="4" fill="#60A5FA"/><text x="1118" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#F4F7FB" text-anchor="start">What would justify a split?</text><text x="1118" y="277" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">independent scaling pressure</text><text x="1118" y="304" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">separate ownership / release cadence</text><text x="1118" y="331" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">hard isolation or compliance boundary</text><text x="1118" y="358" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#9FB0C8" text-anchor="start">measured operational bottleneck</text><text x="70" y="465" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" fill="#9FB0C8" text-anchor="start">Chosen topology</text><rect x="70" y="490" width="250" height="120" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="490" width="7" height="120" rx="4" fill="#4FD1C5"/><text x="98" y="532" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#F4F7FB" text-anchor="start">Angular</text><text x="98" y="562" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">single SPA</text><line x1="320" y1="550" x2="405" y2="550" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="405" y="480" width="410" height="140" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="405" y="480" width="7" height="140" rx="4" fill="#A78BFA"/><text x="433" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Django monolith</text><text x="433" y="552" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">domain modules + shared transactions</text><line x1="815" y1="550" x2="900" y2="550" stroke="#34D399" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="900" y="490" width="250" height="120" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="900" y="490" width="7" height="120" rx="4" fill="#34D399"/><text x="928" y="532" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#F4F7FB" text-anchor="start">PostgreSQL</text><text x="928" y="562" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">single source of truth</text><line x1="1150" y1="550" x2="1235" y2="550" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1235" y="480" width="285" height="140" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1235" y="480" width="7" height="140" rx="4" fill="#FBBF24"/><text x="1263" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Async edges</text><text x="1263" y="552" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">Celery / external I/O only</text><rect x="70" y="665" width="1450" height="140" rx="20" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="70" y="665" width="7" height="140" rx="4" fill="#A78BFA"/><text x="96" y="696" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#A78BFA" text-anchor="start">ARCHITECTURAL DECISION</text><text x="96" y="725" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">Prefer internal modularity before network decomposition</text><text x="96" y="756" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">WHY</text><text x="807" y="756" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">CONSEQUENCE</text><text x="96" y="781" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">the hardest coupling is business consistency, not CPU or traffic</text><text x="807" y="781" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">we keep architectural seams that can be extracted later without paying</text><text x="807" y="803" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">distributed-system tax today</text><text x="80" y="861" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="857" r="5" fill="#4FD1C5"/><text x="711" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="825" cy="857" r="5" fill="#A78BFA"/><text x="836" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="950" cy="857" r="5" fill="#34D399"/><text x="961" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1095" cy="857" r="5" fill="#FBBF24"/><text x="1106" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1220" cy="857" r="5" fill="#60A5FA"/><text x="1231" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1345" cy="857" r="5" fill="#FB7185"/><text x="1356" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>