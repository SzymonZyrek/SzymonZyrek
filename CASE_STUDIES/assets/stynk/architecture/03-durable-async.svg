<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="760" fill="#10243E" text-anchor="start">Stynk CRM — durable automation, isolated from the request path</text><text x="40" y="94" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#657895" text-anchor="start">Slow or external work leaves the request lifecycle without losing committed business intent.</text><rect x="40" y="115" width="1520" height="54" rx="14" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.2"/><text x="60" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#F08A00" text-anchor="start">KEY PRINCIPLE</text><text x="180" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#10243E" text-anchor="start">PostgreSQL owns durable work state; Redis transports; Celery executes; Beat reconciles</text><rect x="55" y="235" width="225" height="105" rx="16" fill="#F1EEFF" stroke="#6E56E8" stroke-width="1.5"/><text x="167.5" y="277" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#6E56E8" text-anchor="middle">Business transaction</text><text x="167.5" y="305" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">domain update +</text><text x="167.5" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">DomainWorkItem</text><line x1="280" y1="287" x2="323" y2="287" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="335" y="235" width="160" height="105" rx="16" fill="#EAF9F4" stroke="#10A979" stroke-width="1.5"/><text x="415" y="277" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#10A979" text-anchor="middle">COMMIT</text><text x="415" y="305" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">durable intent</text><text x="415" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">exists</text><line x1="495" y1="287" x2="543" y2="287" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="555" y="235" width="180" height="105" rx="16" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.5"/><text x="645" y="277" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#2F7BF6" text-anchor="middle">Redis broker</text><text x="645" y="305" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">identifier</text><text x="645" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">transport</text><line x1="735" y1="287" x2="783" y2="287" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="795" y="235" width="220" height="105" rx="16" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.5"/><text x="905" y="277" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#F08A00" text-anchor="middle">Celery worker</text><text x="905" y="305" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">reload durable state</text><line x1="1015" y1="287" x2="1063" y2="287" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1075" y="235" width="220" height="105" rx="16" fill="#EAF9F4" stroke="#10A979" stroke-width="1.5"/><text x="1185" y="277" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#10A979" text-anchor="middle">External effect</text><text x="1185" y="305" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">mail / OCR /</text><text x="1185" y="323" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">maintenance</text><rect x="55" y="390" width="1240" height="155" rx="18" fill="#FFFFFF" stroke="#10A979" stroke-width="1.4"/><text x="80" y="426" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#10A979" text-anchor="start">Recovery path is built into the model</text><text x="80" y="456" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="560" fill="#10243E" text-anchor="start">If delivery fails, the durable work item remains pending. Celery Beat / reconciliation</text><text x="80" y="477" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="560" fill="#10243E" text-anchor="start">discovers it later and re-enqueues the identifier.</text><rect x="80" y="500" width="245" height="30" rx="15" fill="#EAF9F4" stroke="#10A979" stroke-width="1.5"/><text x="202.5" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#10A979" text-anchor="middle">PENDING WORK REMAINS INSPECTABLE</text><line x1="715" y1="500" x2="715" y2="352" stroke="#10A979" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="745" y="505" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="680" fill="#10A979" text-anchor="start">re-enqueue after recovery</text><text x="55" y="595" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="740" fill="#10243E" text-anchor="start">Worker isolation keeps heavy providers from becoming application latency</text><rect x="55" y="625" width="710" height="150" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.4"/><text x="80" y="660" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="740" fill="#2F7BF6" text-anchor="start">Normal application queues</text><rect x="80" y="690" width="170" height="30" rx="15" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.5"/><text x="165" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2F7BF6" text-anchor="middle">DEFAULT</text><rect x="285" y="690" width="170" height="30" rx="15" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.5"/><text x="370" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2F7BF6" text-anchor="middle">NOTIFICATIONS</text><rect x="490" y="690" width="170" height="30" rx="15" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.5"/><text x="575" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2F7BF6" text-anchor="middle">MAINTENANCE</text><text x="80" y="748" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">Fast application work shares the normal worker path.</text><rect x="795" y="625" width="750" height="150" rx="18" fill="#FFFFFF" stroke="#F08A00" stroke-width="1.4"/><text x="820" y="660" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="740" fill="#F08A00" text-anchor="start">Isolated OCR / AI queues</text><rect x="820" y="690" width="150" height="30" rx="15" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.5"/><text x="895" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F08A00" text-anchor="middle">OCR</text><rect x="990" y="690" width="150" height="30" rx="15" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.5"/><text x="1065" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F08A00" text-anchor="middle">AI</text><text x="820" y="748" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">Provider latency, retries and larger document jobs stay away from</text><text x="820" y="767" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">ordinary background work.</text><rect x="40" y="832" width="1520" height="48" rx="14" fill="#10243E"/><text x="60" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#FFFFFF" text-anchor="start">Result</text><text x="195" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#E7EEF7" text-anchor="start">responsive requests · recoverable async work · isolated heavy processing · inspectable retries</text></svg>