<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="210" fill="#163B63" opacity="0.14"/><circle cx="170" cy="860" r="260" fill="#3D2A6D" opacity="0.10"/>
<text x="80" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="750" fill="#F4F7FB" text-anchor="start">Reliable background work</text><text x="80" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="450" fill="#9FB0C8" text-anchor="start">The queue transports work; durable application state decides whether the work exists</text><text x="1515" y="79" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">03</text>
<line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><rect x="70" y="220" width="260" height="165" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="220" width="7" height="165" rx="4" fill="#A78BFA"/><text x="98" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Business transaction</text><text x="98" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">domain mutation</text><text x="98" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">work intent</text><line x1="330" y1="302" x2="355" y2="302" stroke="#34D399" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="370" y="220" width="270" height="165" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="370" y="220" width="7" height="165" rx="4" fill="#34D399"/><text x="398" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">PostgreSQL</text><text x="398" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">DomainWorkItem</text><text x="398" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">status / retries</text><text x="398" y="342" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">source of record</text><line x1="640" y1="302" x2="665" y2="302" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="680" y="220" width="220" height="165" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="680" y="220" width="7" height="165" rx="4" fill="#60A5FA"/><text x="708" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">after_commit</text><text x="708" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">enqueue ID only</text><text x="708" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">no business payload</text><line x1="900" y1="302" x2="945" y2="302" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="960" y="220" width="190" height="165" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="960" y="220" width="7" height="165" rx="4" fill="#60A5FA"/><text x="988" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Redis</text><text x="988" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">Celery broker</text><text x="988" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">transport state</text><line x1="1150" y1="302" x2="1200" y2="302" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1215" y="220" width="305" height="165" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1215" y="220" width="7" height="165" rx="4" fill="#FBBF24"/><text x="1243" y="262" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Workers</text><text x="1243" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">default / notifications</text><text x="1243" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">maintenance / OCR / AI</text><rect x="370" y="450" width="270" height="125" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="370" y="450" width="7" height="125" rx="4" fill="#FBBF24"/><text x="398" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Celery Beat</text><text x="398" y="522" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">periodic schedules</text><text x="398" y="549" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">reconciliation</text><line x1="505" y1="450" x2="505" y2="385" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="680" y="440" width="520" height="145" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="680" y="440" width="7" height="145" rx="4" fill="#34D399"/><text x="708" y="482" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">Failure behaviour</text><text x="708" y="512" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">Redis down → durable row remains pending</text><text x="708" y="539" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">broker recovers → Beat re-enqueues</text><text x="708" y="566" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">worker retry never invents business truth</text><rect x="1235" y="440" width="285" height="145" rx="22" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="1235" y="440" width="7" height="145" rx="4" fill="#FBBF24"/><text x="1263" y="482" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" fill="#F4F7FB" text-anchor="start">External effects</text><text x="1263" y="512" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">mail / OCR / APIs</text><text x="1263" y="539" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#9FB0C8" text-anchor="start">happen after commit</text><rect x="70" y="650" width="1450" height="150" rx="20" fill="#14233A" stroke="#29415F" stroke-width="2"/><rect x="70" y="650" width="7" height="150" rx="4" fill="#34D399"/><text x="96" y="681" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#34D399" text-anchor="start">ARCHITECTURAL DECISION</text><text x="96" y="710" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F4F7FB" text-anchor="start">Do not make Redis or Celery the business database</text><text x="96" y="741" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">WHY</text><text x="807" y="741" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">CONSEQUENCE</text><text x="96" y="766" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">broker state can disappear or be unavailable independently of committed</text><text x="96" y="788" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">business data</text><text x="807" y="766" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">failures become recoverable from PostgreSQL; the cost is explicit</text><text x="807" y="788" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="450" fill="#F4F7FB" text-anchor="start">reconciliation and idempotency logic</text><text x="80" y="861" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="857" r="5" fill="#4FD1C5"/><text x="711" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="825" cy="857" r="5" fill="#A78BFA"/><text x="836" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="950" cy="857" r="5" fill="#34D399"/><text x="961" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1095" cy="857" r="5" fill="#FBBF24"/><text x="1106" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1220" cy="857" r="5" fill="#60A5FA"/><text x="1231" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1345" cy="857" r="5" fill="#FB7185"/><text x="1356" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>