<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101D"/><stop offset="1" stop-color="#0D1830"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="80" r="220" fill="#163B63" opacity="0.12"/><circle cx="180" cy="850" r="250" fill="#3D2A6D" opacity="0.08"/><text x="80" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="760" fill="#F4F7FB" text-anchor="start">Durable intent first. Queue delivery second.</text><text x="80" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">The queue carries work; PostgreSQL remembers that the work exists. That distinction closes the commit/enqueue failure</text><text x="80" y="137" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="450" fill="#9FB0C8" text-anchor="start">gap.</text><text x="1518" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#9FB0C8" text-anchor="end">03</text><line x1="80" y1="150" x2="1520" y2="150" stroke="#203653" stroke-width="2" stroke-linecap="round"/><text x="70" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" fill="#9FB0C8" text-anchor="start">THE FAILURE WINDOW</text><rect x="90" y="340" width="180" height="86" rx="16" fill="#14233A" stroke="#A78BFA" stroke-width="2"/><text x="180" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">Business mutation</text><rect x="305" y="340" width="190" height="86" rx="16" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="400" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">DomainWorkItem</text><rect x="535" y="340" width="100" height="86" rx="16" fill="#14233A" stroke="#34D399" stroke-width="2"/><text x="585" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">COMMIT</text><rect x="680" y="340" width="145" height="86" rx="16" fill="#14233A" stroke="#60A5FA" stroke-width="2"/><text x="752.5" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">enqueue ID</text><rect x="870" y="340" width="115" height="86" rx="16" fill="#14233A" stroke="#60A5FA" stroke-width="2"/><text x="927.5" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">Redis</text><rect x="1025" y="340" width="140" height="86" rx="16" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="1095" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">Worker</text><rect x="1210" y="340" width="210" height="86" rx="16" fill="#14233A" stroke="#FBBF24" stroke-width="2"/><text x="1315" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F4F7FB" text-anchor="middle">External effect</text><line x1="270" y1="383" x2="295" y2="383" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="495" y1="383" x2="525" y2="383" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="635" y1="383" x2="670" y2="383" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="825" y1="383" x2="860" y2="383" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="985" y1="383" x2="1015" y2="383" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1165" y1="383" x2="1200" y2="383" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="305" y="210" width="330" height="90" rx="14" fill="#0F1B2D" stroke="#FB7185" stroke-width="1.5"/><text x="325" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#FB7185" text-anchor="start">If publish happens before commit</text><text x="325" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">an external effect may outlive a</text><text x="325" y="284" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">rolled-back transaction.</text><line x1="470" y1="300" x2="470" y2="335" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="535" y="470" width="330" height="90" rx="14" fill="#0F1B2D" stroke="#FB7185" stroke-width="1.5"/><text x="555" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750" fill="#FB7185" text-anchor="start">If commit succeeds but enqueue fails</text><text x="555" y="525" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">the durable work item still proves that</text><text x="555" y="544" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#9FB0C8" text-anchor="start">execution is owed.</text><line x1="700" y1="430" x2="700" y2="470" stroke="#FB7185" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="930" y="555" width="520" height="105" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="930" y="555" width="7" height="105" rx="4" fill="#FBBF24"/><text x="960" y="590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="730" fill="#F4F7FB" text-anchor="start">Recovery path</text><text x="960" y="620" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="start">Celery Beat / reconciler finds pending durable work and</text><text x="960" y="640" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#9FB0C8" text-anchor="start">re-enqueues identifiers.</text><line x1="1190" y1="555" x2="1190" y2="440" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="70" y="595" width="760" height="155" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="70" y="595" width="7" height="155" rx="4" fill="#34D399"/><text x="100" y="630" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#34D399" text-anchor="start">WHAT THIS GUARANTEES</text><text x="100" y="665" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#F4F7FB" text-anchor="start">Committed work intent survives transport failure. Retries can be reasoned</text><text x="100" y="688" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#F4F7FB" text-anchor="start">about from inspectable application state.</text><rect x="855" y="690" width="665" height="60" rx="18" fill="#0F1B2D" stroke="#29415F" stroke-width="2"/><rect x="855" y="690" width="7" height="60" rx="4" fill="#FB7185"/><text x="880" y="725" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#FB7185" text-anchor="start">NOT promised:</text><text x="980" y="725" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#F4F7FB" text-anchor="start">exactly-once external effects</text><text x="80" y="864" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#9FB0C8" text-anchor="start">STYNK CRM · ARCHITECTURE CASE STUDY</text><circle cx="700" cy="858" r="5" fill="#4FD1C5"/><text x="711" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">CONFIG / USER</text><circle cx="830" cy="858" r="5" fill="#A78BFA"/><text x="841" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">APP / MODEL</text><circle cx="960" cy="858" r="5" fill="#34D399"/><text x="971" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">DURABLE STATE</text><circle cx="1110" cy="858" r="5" fill="#FBBF24"/><text x="1121" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">ASYNC / OPS</text><circle cx="1240" cy="858" r="5" fill="#60A5FA"/><text x="1251" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">TRANSPORT</text><circle cx="1370" cy="858" r="5" fill="#FB7185"/><text x="1381" y="863" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#9FB0C8" text-anchor="start">LEGACY / RISK</text></svg>