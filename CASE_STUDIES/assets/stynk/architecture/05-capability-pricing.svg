<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="780" fill="#10243E" text-anchor="start">Stynk CRM — Jobs composed from reusable typed capabilities</text><text x="40" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#687B96" text-anchor="start">Canonical Composites define shape; Stynk bindings assign business roles; Interfaces attach reusable behavior.</text><rect x="40" y="112" width="1520" height="50" rx="13" fill="#FFFFFF" stroke="#D8E3EF" stroke-width="1.1"/><text x="58" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#6F56E8" text-anchor="start">PRICING MODEL</text><text x="185" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="620" fill="#10243E" text-anchor="start">the common case is a convention; advanced pricing edits the same executable graph</text><rect x="45" y="195" width="430" height="540" rx="18" fill="#FFFFFF" stroke="#6F56E8" stroke-width="1.5"/><text x="70" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#6F56E8" text-anchor="start">1 · Model the Job shape</text><rect x="75" y="275" width="370" height="100" rx="14" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1.2"/><text x="260" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#10243E" text-anchor="middle">Composite: RoofJob</text><text x="260" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#687B96" text-anchor="middle">typed fields + references</text><line x1="260" y1="380" x2="260" y2="425" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="75" y="435" width="370" height="95" rx="14" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.2"/><text x="260" y="472" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#2F7BF6" text-anchor="middle">Stynk Job binding</text><text x="260" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#687B96" text-anchor="middle">exposes the Composite as a CRM Job</text><text x="75" y="585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">Allowed Operations are binding</text><text x="75" y="606" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">relationships, not special fields forced</text><text x="75" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">into the generic type system.</text><rect x="500" y="195" width="520" height="540" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.5"/><text x="525" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#2F7BF6" text-anchor="start">2 · Compose typed Operations</text><rect x="530" y="275" width="215" height="78" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="548" y="305" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="720" fill="#10243E" text-anchor="start">Painting</text><text x="548" y="331" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="start">area · coating · rate</text><line x1="745" y1="314" x2="780" y2="314" stroke="#6F56E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="790" y="275" width="195" height="78" rx="12" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1"/><text x="887" y="306" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#6F56E8" text-anchor="middle">Priced.price()</text><text x="887" y="331" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">typed capability</text><rect x="530" y="370" width="215" height="78" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="548" y="400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="720" fill="#10243E" text-anchor="start">Washing</text><text x="548" y="426" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="start">area · method</text><line x1="745" y1="409" x2="780" y2="409" stroke="#6F56E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="790" y="370" width="195" height="78" rx="12" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1"/><text x="887" y="401" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#6F56E8" text-anchor="middle">Priced.price()</text><text x="887" y="426" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">typed capability</text><rect x="530" y="465" width="215" height="78" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="548" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="720" fill="#10243E" text-anchor="start">Repair</text><text x="548" y="521" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="start">quantity · unit</text><line x1="745" y1="504" x2="780" y2="504" stroke="#6F56E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="790" y="465" width="195" height="78" rx="12" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1"/><text x="887" y="496" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#6F56E8" text-anchor="middle">Priced.price()</text><text x="887" y="521" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">typed capability</text><rect x="530" y="575" width="455" height="100" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="548" y="607" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#2F7BF6" text-anchor="start">typed pricing_context</text><text x="548" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">parent Job · Contract/VAT · constants/rates</text><rect x="1045" y="195" width="510" height="540" rx="18" fill="#FFFFFF" stroke="#6F56E8" stroke-width="1.5"/><text x="1070" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#6F56E8" text-anchor="start">3 · One composition model</text><rect x="1070" y="265" width="110" height="30" rx="15" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1.2"/><text x="1125" y="285" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#6F56E8" text-anchor="middle">DEFAULT</text><rect x="1070" y="310" width="460" height="125" rx="14" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1.2"/><text x="1300" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#10243E" text-anchor="middle">self.operations</text><text x="1300" y="375" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#6F56E8" text-anchor="middle">→ map Priced.price()</text><text x="1300" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#10243E" text-anchor="middle">→ aggregate PricingResult</text><line x1="1300" y1="440" x2="1300" y2="480" stroke="#6F56E8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1070" y="465" width="130" height="30" rx="15" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1.2"/><text x="1135" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#6F56E8" text-anchor="middle">CUSTOMISE</text><rect x="1070" y="510" width="460" height="165" rx="14" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1.2"/><text x="1095" y="545" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#10243E" text-anchor="start">Materialise the same default graph, then</text><text x="1095" y="567" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#10243E" text-anchor="start">edit it in Studio.</text><text x="1095" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#687B96" text-anchor="start">Filter Operations, add minima or discounts,</text><text x="1095" y="620" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#687B96" text-anchor="start">change aggregation, or replace the whole</text><text x="1095" y="640" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#687B96" text-anchor="start">path.</text><rect x="40" y="812" width="1520" height="42" rx="12" fill="#10243E"/><text x="60" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#FFFFFF" text-anchor="start">One runtime model</text><text x="210.8" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="450" fill="#E8EFF7" text-anchor="start">convention for the common case · graph composition for the exceptional case · typed execution throughout</text><circle cx="45" cy="877" r="4" fill="#2F7BF6"/><text x="55" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">APP / FLOW</text><circle cx="230" cy="877" r="4" fill="#0FA978"/><text x="240" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">DURABLE STATE</text><circle cx="435" cy="877" r="4" fill="#6F56E8"/><text x="445" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">MODEL / RUNTIME</text><circle cx="620" cy="877" r="4" fill="#F08A00"/><text x="630" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">ASYNC / EXTERNAL</text><circle cx="805" cy="877" r="4" fill="#E64B5D"/><text x="815" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">TRUST / SECURITY</text></svg>