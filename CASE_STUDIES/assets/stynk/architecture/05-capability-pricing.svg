<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="760" fill="#10243E" text-anchor="start">Stynk CRM — Jobs are composed from reusable typed capabilities</text><text x="40" y="94" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#657895" text-anchor="start">A Job is configuration plus bindings; Operations bring behavior through interfaces instead of hard-coded class trees.</text><rect x="40" y="115" width="1520" height="54" rx="14" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1.2"/><text x="60" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#2F7BF6" text-anchor="start">MODEL</text><text x="180" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#10243E" text-anchor="start">canonical Composites describe shape; Stynk bindings assign business roles; Interfaces attach reusable behavior</text><rect x="55" y="205" width="370" height="505" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.5"/><text x="80" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#2F7BF6" text-anchor="start">1 · Bind a canonical Composite</text><rect x="85" y="285" width="310" height="100" rx="15" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.3"/><text x="240" y="322" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#10243E" text-anchor="middle">Composite: RoofJob</text><text x="240" y="351" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="middle">typed fields + references</text><line x1="240" y1="390" x2="240" y2="430" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="85" y="440" width="310" height="105" rx="15" fill="#FFFFFF" stroke="#10A979" stroke-width="1.3"/><text x="240" y="477" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#10A979" text-anchor="middle">Stynk Job binding</text><text x="240" y="505" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="middle">exposes Composite as CRM Job</text><text x="85" y="585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#657895" text-anchor="start">Allowed Operations are binding</text><text x="85" y="606" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#657895" text-anchor="start">relations — not magic fields added</text><text x="85" y="627" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#657895" text-anchor="start">to the generic type.</text><rect x="465" y="205" width="500" height="505" rx="18" fill="#FFFFFF" stroke="#10A979" stroke-width="1.5"/><text x="490" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#10A979" text-anchor="start">2 · Compose Operations</text><rect x="495" y="285" width="205" height="82" rx="14" fill="#EAF9F4" stroke="#10A979" stroke-width="1.2"/><text x="515" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" fill="#10243E" text-anchor="start">Painting</text><text x="515" y="342" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="start">area · coating · rate</text><rect x="735" y="285" width="195" height="82" rx="14" fill="#F1EEFF" stroke="#6E56E8" stroke-width="1.2"/><text x="833" y="316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" fill="#6E56E8" text-anchor="middle">Priced.price()</text><text x="833" y="341" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">typed capability</text><line x1="700" y1="326" x2="730" y2="326" stroke="#6E56E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="495" y="390" width="205" height="82" rx="14" fill="#EAF9F4" stroke="#10A979" stroke-width="1.2"/><text x="515" y="422" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" fill="#10243E" text-anchor="start">Washing</text><text x="515" y="447" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="start">area · method</text><rect x="735" y="390" width="195" height="82" rx="14" fill="#F1EEFF" stroke="#6E56E8" stroke-width="1.2"/><text x="833" y="421" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" fill="#6E56E8" text-anchor="middle">Priced.price()</text><text x="833" y="446" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">typed capability</text><line x1="700" y1="431" x2="730" y2="431" stroke="#6E56E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="495" y="495" width="205" height="82" rx="14" fill="#EAF9F4" stroke="#10A979" stroke-width="1.2"/><text x="515" y="527" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="720" fill="#10243E" text-anchor="start">Repair</text><text x="515" y="552" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="start">quantity · unit</text><rect x="735" y="495" width="195" height="82" rx="14" fill="#F1EEFF" stroke="#6E56E8" stroke-width="1.2"/><text x="833" y="526" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" fill="#6E56E8" text-anchor="middle">Priced.price()</text><text x="833" y="551" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="middle">typed capability</text><line x1="700" y1="536" x2="730" y2="536" stroke="#6E56E8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="495" y="610" width="435" height="65" rx="14" fill="#E8F7F8" stroke="#128C96" stroke-width="1.2"/><text x="515" y="637" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="740" fill="#128C96" text-anchor="start">typed pricing_context</text><text x="515" y="660" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#657895" text-anchor="start">parent Job · Contract/VAT · constants/rates</text><rect x="1005" y="205" width="540" height="505" rx="18" fill="#FFFFFF" stroke="#6E56E8" stroke-width="1.5"/><text x="1030" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#6E56E8" text-anchor="start">3 · One pricing composition model</text><rect x="1030" y="275" width="165" height="30" rx="15" fill="#F1EEFF" stroke="#6E56E8" stroke-width="1.5"/><text x="1112.5" y="295" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#6E56E8" text-anchor="middle">DEFAULT CONVENTION</text><rect x="1030" y="320" width="485" height="112" rx="14" fill="#F1EEFF" stroke="#6E56E8" stroke-width="1.3"/><text x="1272" y="350" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#10243E" text-anchor="middle">operations</text><text x="1272" y="378" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="740" fill="#6E56E8" text-anchor="middle">→ map Priced.price()</text><text x="1272" y="405" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#10243E" text-anchor="middle">→ aggregate PricingResults</text><line x1="1272" y1="438" x2="1272" y2="478" stroke="#6E56E8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1030" y="460" width="120" height="30" rx="15" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.5"/><text x="1090" y="480" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F08A00" text-anchor="middle">CUSTOMISE</text><rect x="1030" y="505" width="485" height="140" rx="14" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.3"/><text x="1055" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#10243E" text-anchor="start">Materialise the same default graph, then</text><text x="1055" y="556" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#10243E" text-anchor="start">edit it in Studio.</text><text x="1055" y="586" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">filter Operations · add minima/discounts ·</text><text x="1055" y="605" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#657895" text-anchor="start">replace aggregation · replace the whole path</text><rect x="40" y="832" width="1520" height="48" rx="14" fill="#10243E"/><text x="60" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="760" fill="#FFFFFF" text-anchor="start">One model</text><text x="195" y="862" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="450" fill="#E7EEF7" text-anchor="start">simple convention for the common case · graph composition for the exceptional case · same typed runtime underneath</text></svg>