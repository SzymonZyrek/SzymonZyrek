Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="740" fill="#6F56E8" text-anchor="start">Versioning</text><text x="1048" y="364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">ModelRevision ·</text><text x="1048" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">ModelContext</text><rect x="1270" y="300" width="215" height="105" rx="12" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1"/><text x="1286" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="740" fill="#6F56E8" text-anchor="start">Execution</text><text x="1286" y="364" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">RuntimeObject ·</text><text x="1286" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">dispatch</text><line x1="800" y1="455" x2="800" y2="505" stroke="#6F56E8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="684" y="468" width="232" height="30" rx="15" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1.2"/><text x="800" y="488" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#6F56E8" text-anchor="middle">GENERIC RUNTIME CONTRACTS</text><rect x="55" y="525" width="1490" height="245" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.5"/><text x="80" y="560" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#2F7BF6" text-anchor="start">Stynk System layer</text><text x="80" y="587" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#687B96" text-anchor="start">Application bindings translate generic model/runtime primitives into CRM behavior.</text><rect x="80" y="630" width="270" height="96" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="96" y="662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="740" fill="#2F7BF6" text-anchor="start">Job binding</text><text x="96" y="691" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">which Composite is a CRM Job</text><rect x="370" y="630" width="270" height="96" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="386" y="662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="740" fill="#2F7BF6" text-anchor="start">Operation binding</text><text x="386" y="691" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">which Operations are allowed</text><rect x="660" y="630" width="270" height="96" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="676" y="662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="740" fill="#2F7BF6" text-anchor="start">Pricing context</text><text x="676" y="691" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">Contract · VAT · parent Job</text><rect x="950" y="630" width="270" height="96" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="966" y="662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="740" fill="#2F7BF6" text-anchor="start">CRM lifecycle</text><text x="966" y="691" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">planning · payments ·</text><text x="966" y="708" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">notifications</text><rect x="1240" y="630" width="270" height="96" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="1256" y="662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="740" fill="#2F7BF6" text-anchor="start">Studio adapters</text><text x="1256" y="691" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="520" fill="#10243E" text-anchor="start">business-friendly authoring</text><rect x="40" y="812" width="1520" height="42" rx="12" fill="#10243E"/><text x="60" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#FFFFFF" text-anchor="start">Extensibility without domain leakage</text><text x="351.40000000000003" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="450" fill="#E8EFF7" text-anchor="start">generic runtime below · explicit Stynk semantics above · reuse grows where semantics actually repeat</text><circle cx="45" cy="877" r="4" fill="#2F7BF6"/><text x="55" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">APP / FLOW</text><circle cx="230" cy="877" r="4" fill="#0FA978"/><text x="240" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">DURABLE STATE</text><circle cx="435" cy="877" r="4" fill="#6F56E8"/><text x="445" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">MODEL / RUNTIME</text><circle cx="620" cy="877" r="4" fill="#F08A00"/><text x="630" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">ASYNC / EXTERNAL</text><circle cx="805" cy="877" r="4" fill="#E64B5D"/><text x="815" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">TRUST / SECURITY</text></svg>