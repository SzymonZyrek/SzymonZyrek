<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="780" fill="#10243E" text-anchor="start">Stynk CRM — reusable model kernel, explicit business bindings</text><text x="40" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#687B96" text-anchor="start">Generic execution semantics are shared; Job, Operation and CRM meaning stay visible in the Stynk layer.</text><rect x="40" y="112" width="1520" height="50" rx="13" fill="#FFFFFF" stroke="#D8E3EF" stroke-width="1.1"/><text x="58" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#6F56E8" text-anchor="start">SEPARATION</text><text x="185" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="620" fill="#10243E" text-anchor="start">generalise reusable semantics below; keep business roles explicit above</text><rect x="55" y="195" width="1490" height="260" rx="18" fill="#FFFFFF" stroke="#6F56E8" stroke-width="1.5"/><text x="80" y="230" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#6F56E8" text-anchor="start">Platform kernel</text><text x="80" y="257" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#687B96" text-anchor="start">Reusable semantics that do not know what a roof, contract or subcontractor is.</text><rect x="80" y="300" width="220" height="105" rx="12" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1"/><text x="96" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="740" fill="#6F56E8" text-anchor="start">Type system</text><text x="96" y="364"