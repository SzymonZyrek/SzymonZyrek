<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="780" fill="#10243E" text-anchor="start">Stynk CRM — one business core, modular by domain</text><text x="40" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#687B96" text-anchor="start">Connected business workflows stay transactional; module and service boundaries keep responsibilities explicit.</text><rect x="40" y="112" width="1520" height="50" rx="13" fill="#FFFFFF" stroke="#D8E3EF" stroke-width="1.1"/><text x="58" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#2F7BF6" text-anchor="start">ARCHITECTURE</text><text x="185" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="620" fill="#10243E" text-anchor="start">keep related business state together; move slow, public or external concerns through explicit seams</text><rect x="40" y="190" width="245" height="500" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.5"/><text x="65" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#2F7BF6" text-anchor="start">User &amp; API boundary</text><rect x="70" y="265" width="185" height="82" rx="14" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.2"/><text x="162" y="300" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="730" fill="#10243E" text-anchor="middle">Angular CRM</text><text x="162" y="327" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#687B96" text-anchor="middle">role-focused UI</text><line x1="162" y1="350" x2="162" y2="392" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="405" width="185" height="82" rx="14" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.2"/><text x="162" y="440" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="730" fill="#10243E" text-anchor="middle">DRF API</text><text x="162" y="467" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#687B96" text-anchor="middle">thin HTTP layer</text><text x="70" y="540" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">Auth, permissions, request</text><text x="70" y="560" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">validation and</text><text x="70" y="580" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">serialization stay at the</text><text x="70" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">edge.</text><rect x="315" y="190" width="870" height="500" rx="18" fill="#FFFFFF" stroke="#D8E3EF" stroke-width="1.2"/><text x="340" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#10243E" text-anchor="start">Business services</text><text x="340" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#687B96" text-anchor="start">Domain ownership in code; cross-domain workflows in services.</text><rect x="340" y="290" width="180" height="72" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="430" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">Contracts</text><rect x="545" y="290" width="180" height="72" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="635" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">Jobs</text><rect x="750" y="290" width="180" height="72" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="840" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">Pricing</text><rect x="955" y="290" width="180" height="72" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="1045" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">Payments</text><rect x="340" y="390" width="180" height="72" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="430" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">Planning</text><rect x="545" y="390" width="180" height="72" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="635" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">Materials /</text><text x="635" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">equipment</text><rect x="750" y="390" width="180" height="72" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="840" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">Attachments</text><rect x="955" y="390" width="180" height="72" rx="12" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1"/><text x="1045" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">Notifications /</text><text x="1045" y="438" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#10243E" text-anchor="middle">audit</text><rect x="340" y="500" width="795" height="135" rx="14" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.3"/><text x="365" y="535" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760" fill="#2F7BF6" text-anchor="start">Service layer owns the workflow</text><text x="365" y="568" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">Validate transitions, update related models, create obligations, notify</text><text x="365" y="589" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">the right people and write audit state in one controlled path.</text><rect x="1215" y="190" width="345" height="500" rx="18" fill="#FFFFFF" stroke="#0FA978" stroke-width="1.5"/><text x="1240" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#0FA978" text-anchor="start">Durable business state</text><rect x="1245" y="275" width="285" height="125" rx="15" fill="#EAF9F4" stroke="#0FA978" stroke-width="1.2"/><text x="1388" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="780" fill="#0FA978" text-anchor="middle">PostgreSQL</text><text x="1388" y="344" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="550" fill="#687B96" text-anchor="middle">one business source of truth</text><text x="1388" y="373" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#687B96" text-anchor="middle">shared transaction boundary</text><text x="1245" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">Contracts, Jobs, pricing snapshots,</text><text x="1245" y="476" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">payments, planning, audit and durable</text><text x="1245" y="497" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">background-work state stay mutually</text><text x="1245" y="518" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="520" fill="#687B96" text-anchor="start">consistent.</text><line x1="285" y1="440" x2="310" y2="440" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1185" y1="440" x2="1210" y2="440" stroke="#0FA978" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="40" y="725" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="740" fill="#10243E" text-anchor="start">Explicit seams around the core</text><rect x="40" y="745" width="355" height="54" rx="12" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.1"/><text x="56" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#10243E" text-anchor="start">Background work</text><text x="379" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">Celery workers</text><rect x="405" y="745" width="355" height="54" rx="12" fill="#EEF3F8" stroke="#5E7188" stroke-width="1.1"/><text x="421" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#10243E" text-anchor="start">Protected files</text><text x="744" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">permission-checked delivery</text><rect x="770" y="745" width="355" height="54" rx="12" fill="#FFF0F2" stroke="#E64B5D" stroke-width="1.1"/><text x="786" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#10243E" text-anchor="start">Public website</text><text x="1109" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">allowlisted public surface</text><rect x="1135" y="745" width="425" height="54" rx="12" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.1"/><text x="1151" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#10243E" text-anchor="start">External providers</text><text x="1544" y="768" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="end">mail · OCR · AI</text><rect x="40" y="812" width="1520" height="42" rx="12" fill="#10243E"/><text x="60" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#FFFFFF" text-anchor="start">What this buys us</text><text x="210.8" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="450" fill="#E8EFF7" text-anchor="start">atomic lifecycle changes · one business truth · explicit ownership · clean seams for integration</text><circle cx="45" cy="877" r="4" fill="#2F7BF6"/><text x="55" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">APP / FLOW</text><circle cx="230" cy="877" r="4" fill="#0FA978"/><text x="240" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">DURABLE STATE</text><circle cx="435" cy="877" r="4" fill="#6F56E8"/><text x="445" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">MODEL / RUNTIME</text><circle cx="620" cy="877" r="4" fill="#F08A00"/><text x="630" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">ASYNC / EXTERNAL</text><circle cx="805" cy="877" r="4" fill="#E64B5D"/><text x="815" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">TRUST / SECURITY</text></svg>