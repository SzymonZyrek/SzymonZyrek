<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="780" fill="#10243E" text-anchor="start">Stynk CRM — durable automation outside the request path</text><text x="40" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#687B96" text-anchor="start">Slow or external work leaves the request lifecycle without losing committed business intent.</text><rect x="40" y="112" width="1520" height="50" rx="13" fill="#FFFFFF" stroke="#D8E3EF" stroke-width="1.1"/><text x="58" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#F08A00" text-anchor="start">ASYNC CONTRACT</text><text x="185" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="620" fill="#10243E" text-anchor="start">persist work first; transport identifiers second; execute and reconcile independently</text><rect x="50" y="220" width="235" height="96" rx="14" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.3"/><text x="167.5" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#2F7BF6" text-anchor="middle">Business transaction</text><text x="167.5" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">domain update</text><line x1="285" y1="268" x2="325" y2="268" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="335" y="220" width="220" height="96" rx="14" fill="#EAF9F4" stroke="#0FA978" stroke-width="1.3"/><text x="445" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#0FA978" text-anchor="middle">DomainWorkItem</text><text x="445" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">durable intent</text><line x1="555" y1="268" x2="595" y2="268" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="605" y="220" width="120" height="96" rx="14" fill="#EAF9F4" stroke="#0FA978" stroke-width="1.3"/><text x="665" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#0FA978" text-anchor="middle">COMMIT</text><text x="665" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">source of truth</text><line x1="725" y1="268" x2="765" y2="268" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="775" y="220" width="175" height="96" rx="14" fill="#EEF3F8" stroke="#5E7188" stroke-width="1.3"/><text x="862.5" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#5E7188" text-anchor="middle">Redis</text><text x="862.5" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">transport only</text><line x1="950" y1="268" x2="990" y2="268" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1000" y="220" width="200" height="96" rx="14" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.3"/><text x="1100" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#F08A00" text-anchor="middle">Celery worker</text><text x="1100" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">reload + execute</text><line x1="1200" y1="268" x2="1240" y2="268" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1250" y="220" width="280" height="96" rx="14" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.3"/><text x="1390" y="259" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#F08A00" text-anchor="middle">External effect</text><text x="1390" y="287" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">mail · OCR · maintenance</text><rect x="50" y="365" width="925" height="165" rx="17" fill="#FFFFFF" stroke="#0FA978" stroke-width="1.4"/><text x="75" y="402" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#0FA978" text-anchor="start">Recovery is part of the model</text><text x="75" y="434" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">If broker delivery or a worker process fails, the durable item still says that</text><text x="75" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">execution is owed. Reconciliation can find it and enqueue again.</text><rect x="75" y="480" width="400" height="34" rx="12" fill="#EAF9F4" stroke="#0FA978" stroke-width="1"/><text x="275" y="503" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="760" fill="#0FA978" text-anchor="middle">PENDING WORK REMAINS INSPECTABLE</text><line x1="520" y1="495" x2="855" y2="320" stroke="#0FA978" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="545" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0FA978" text-anchor="start">Beat / reconciliation</text><rect x="1015" y="365" width="515" height="165" rx="17" fill="#FFFFFF" stroke="#F08A00" stroke-width="1.4"/><text x="1040" y="402" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#F08A00" text-anchor="start">Heavy providers are isolated</text><text x="1040" y="434" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">OCR and AI queues do not compete with</text><text x="1040" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">routine notifications or maintenance work.</text><rect x="1040" y="480" width="120" height="30" rx="15" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.2"/><text x="1100" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F08A00" text-anchor="middle">OCR</text><rect x="1175" y="480" width="120" height="30" rx="15" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.2"/><text x="1235" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F08A00" text-anchor="middle">AI</text><text x="50" y="585" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="740" fill="#10243E" text-anchor="start">Worker topology</text><rect x="50" y="615" width="720" height="140" rx="16" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.3"/><text x="75" y="650" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="740" fill="#2F7BF6" text-anchor="start">Normal application work</text><rect x="75" y="685" width="175" height="30" rx="15" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.2"/><text x="162.5" y="705" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2F7BF6" text-anchor="middle">DEFAULT</text><rect x="280" y="685" width="175" height="30" rx="15" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.2"/><text x="367.5" y="705" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2F7BF6" text-anchor="middle">NOTIFICATIONS</text><rect x="485" y="685" width="175" height="30" rx="15" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.2"/><text x="572.5" y="705" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#2F7BF6" text-anchor="middle">MAINTENANCE</text><text x="75" y="733" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#687B96" text-anchor="start">short application-side tasks share the normal worker pool</text><rect x="810" y="615" width="720" height="140" rx="16" fill="#FFFFFF" stroke="#F08A00" stroke-width="1.3"/><text x="835" y="650" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="740" fill="#F08A00" text-anchor="start">External / compute-heavy work</text><rect x="835" y="685" width="175" height="30" rx="15" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.2"/><text x="922.5" y="705" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F08A00" text-anchor="middle">OCR</text><rect x="1040" y="685" width="175" height="30" rx="15" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.2"/><text x="1127.5" y="705" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#F08A00" text-anchor="middle">AI</text><text x="835" y="733" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" fill="#687B96" text-anchor="start">provider latency and retries stay away from ordinary background work</text><rect x="40" y="812" width="1520" height="42" rx="12" fill="#10243E"/><text x="60" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#FFFFFF" text-anchor="start">Result</text><text x="170" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="450" fill="#E8EFF7" text-anchor="start">responsive requests · recoverable background work · inspectable retries · isolated heavy processing</text><circle cx="45" cy="877" r="4" fill="#2F7BF6"/><text x="55" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">APP / FLOW</text><circle cx="230" cy="877" r="4" fill="#0FA978"/><text x="240" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">DURABLE STATE</text><circle cx="435" cy="877" r="4" fill="#6F56E8"/><text x="445" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">MODEL / RUNTIME</text><circle cx="620" cy="877" r="4" fill="#F08A00"/><text x="630" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">ASYNC / EXTERNAL</text><circle cx="805" cy="877" r="4" fill="#E64B5D"/><text x="815" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">TRUST / SECURITY</text></svg>