="13" fill="#EAF9F4" stroke="#0FA978" stroke-width="1.2"/><text x="1370" y="249" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#0FA978" text-anchor="middle">Snapshot</text><text x="1370" y="276" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">stored result</text><rect x="55" y="355" width="720" height="380" rx="18" fill="#FFFFFF" stroke="#0FA978" stroke-width="1.5"/><text x="80" y="392" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#0FA978" text-anchor="start">The result keeps its explanation</text><text x="80" y="423" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">A pricing run can be inspected as structured business evidence,</text><text x="80" y="444" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">not only a final amount.</text><rect x="80" y="485" width="665" height="42" rx="10" fill="#EAF9F4" stroke="#0FA978" stroke-width="0.9"/><circle cx="101" cy="506" r="4" fill="#0FA978"/><text x="120" y="512" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#10243E" text-anchor="start">net / VAT / gross</text><rect x="80" y="535" width="665" height="42" rx="10" fill="#EAF9F4" stroke="#0FA978" stroke-width="0.9"/><circle cx="101" cy="556" r="4" fill="#0FA978"/><text x="120" y="562" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#10243E" text-anchor="start">components</text><rect x="80" y="585" width="665" height="42" rx="10" fill="#EAF9F4" stroke="#0FA978" stroke-width="0.9"/><circle cx="101" cy="606" r="4" fill="#0FA978"/><text x="120" y="612" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#10243E" text-anchor="start">rates / constants</text><rect x="80" y="635" width="665" height="42" rx="10" fill="#EAF9F4" stroke="#0FA978" stroke-width="0.9"/><circle cx="101" cy="656" r="4" fill="#0FA978"/><text x="120" y="662" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#10243E" text-anchor="start">execution trace</text><rect x="80" y="685" width="665" height="42" rx="10" fill="#EAF9F4" stroke="#0FA978" stroke-width="0.9"/><circle cx="101" cy="706" r="4" fill="#0FA978"/><text x="120" y="712" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650" fill="#10243E" text-anchor="start">catalog / revision identity</text><rect x="815" y="355" width="730" height="380" rx="18" fill="#FFFFFF" stroke="#6F56E8" stroke-width="1.5"/><text x="840" y="392" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#6F56E8" text-anchor="start">History stays pinned while policy evolves</text><rect x="860" y="455" width="270" height="100" rx="13" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1.1"/><text x="995" y="491" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#6F56E8" text-anchor="middle">Revision R17</text><text x="995" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">historical Job stays pinned</text><line x1="1130" y1="505" x2="1210" y2="505" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1220" y="455" width="270" height="100" rx="13" fill="#F1EEFF" stroke="#6F56E8" stroke-width="1.1"/><text x="1355" y="491" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#6F56E8" text-anchor="middle">Revision R18</text><text x="1355" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">new work uses new policy</text><text x="860" y="615" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">Studio simulation uses the real interpreter without writing a</text><text x="860" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">real Contract, so authoring feedback and production pricing</text><text x="860" y="657" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="550" fill="#10243E" text-anchor="start">share the same semantics.</text><rect x="860" y="685" width="280" height="30" rx="15" fill="#EAF9F4" stroke="#0FA978" stroke-width="1.2"/><text x="1000" y="705" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#0FA978" text-anchor="middle">SAFE CHANGE, NO HISTORICAL REWRITE</text><rect x="40" y="812" width="1520" height="42" rx="12" fill="#10243E"/><text x="60" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#FFFFFF" text-anchor="start">Safe evolution</text><text x="188.60000000000002" y="839" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="450" fill="#E8EFF7" text-anchor="start">new rules move forward · old meaning stays reproducible · users can inspect how a result was produced</text><circle cx="45" cy="877" r="4" fill="#2F7BF6"/><text x="55" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">APP / FLOW</text><circle cx="230" cy="877" r="4" fill="#0FA978"/><text x="240" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">DURABLE STATE</text><circle cx="435" cy="877" r="4" fill="#6F56E8"/><text x="445" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anchor="start">MODEL / RUNTIME</text><circle cx="620" cy="877" r="4" fill="#F08A00"/><text x="630" y="881" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650" fill="#687B96" text-anch