<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs><rect width="1600" height="900" fill="#F5F8FC"/><text x="40" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="780" fill="#10243E" text-anchor="start">Stynk CRM — every price remains reproducible and explainable</text><text x="40" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#687B96" text-anchor="start">Published model semantics are pinned to the Job; snapshots and trace preserve the result users actually saw.</text><rect x="40" y="112" width="1520" height="50" rx="13" fill="#FFFFFF" stroke="#D8E3EF" stroke-width="1.1"/><text x="58" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#6F56E8" text-anchor="start">EXECUTABLE POLICY</text><text x="185" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="620" fill="#10243E" text-anchor="start">new pricing rules move forward without rewriting historical meaning</text><rect x="55" y="215" width="180" height="86" rx="13" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.2"/><text x="145" y="249" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#2F7BF6" text-anchor="middle">Draft</text><text x="145" y="276" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" fill="#687B96" text-anchor="middle">edit + simulate</text><line x1="235" y1="258" x2="275" y2="258" stroke="#2F7BF6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="285" y="215" width="180" height="86" rx="13" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.2"/><text x="375" y="249" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#2F