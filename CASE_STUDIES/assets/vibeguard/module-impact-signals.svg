<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">VibeGuard module-scoped impact signals</title>
  <desc id="desc">Product capabilities are modules. Paths, routes, symbols, domain state, events, dependencies and semantic analysis provide impact evidence.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#071019"/><stop offset="100%" stop-color="#0d1522"/></linearGradient><linearGradient id="module" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b2a34"/><stop offset="100%" stop-color="#10233a"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#56d8e4"/></marker></defs>
  <rect width="1400" height="860" rx="28" fill="url(#bg)"/><text x="60" y="62" fill="#f3f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">VibeGuard — module-scoped impact</text><text x="60" y="94" fill="#8190a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Capabilities are product responsibilities. Technical structures are evidence, not ownership boundaries.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g filter="url(#shadow)"><rect x="60" y="145" width="330" height="620" rx="24" fill="#0d1723" stroke="#263444"/></g><text x="90" y="185" fill="#cbd5e1" font-size="14" font-weight="700" letter-spacing="2">IMPACT SIGNALS</text>
    <g fill="#111f2d" stroke="#314255"><rect x="90" y="220" width="270" height="60" rx="14"/><rect x="90" y="298" width="270" height="60" rx="14"/><rect x="90" y="376" width="270" height="60" rx="14"/><rect x="90" y="454" width="270" height="60" rx="14"/><rect x="90" y="532" width="270" height="60" rx="14"/><rect x="90" y="610" width="270" height="60" rx="14"/><rect x="90" y="688" width="270" height="50" rx="14"/></g>
    <g fill="#f3f7fb" font-size="16" font-weight="650"><text x="115" y="247">Paths</text><text x="115" y="325">Routes</text><text x="115" y="403">Symbols</text><text x="115" y="481">Domain / storage state</text><text x="115" y="559">Events</text><text x="115" y="637">Dependencies</text><text x="115" y="718">Semantic evidence</text></g>
    <g fill="#8292a6" font-size="12"><text x="115" y="267">files · directories · globs</text><text x="115" y="345">METHOD + endpoint</text><text x="115" y="423">function · class · export</text><text x="115" y="501">schema · repository operation</text><text x="115" y="579">webhook · internal event</text><text x="115" y="657">propagated impact</text></g>
    <path d="M390 455 C440 455 455 455 500 455" stroke="#56d8e4" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)"><rect x="500" y="145" width="420" height="620" rx="24" fill="url(#module)" stroke="#1d6a78"/></g><text x="535" y="185" fill="#70e2eb" font-size="14" font-weight="700" letter-spacing="2">MODULE CAPABILITIES</text><text x="535" y="220" fill="#f3f7fb" font-size="22" font-weight="700">Vertical product boundaries</text><text x="535" y="248" fill="#80a2ad" font-size="13">One module can span HTTP, domain, storage, UI and integrations.</text>
    <g fill="#0b1b26" stroke="#245565"><rect x="535" y="285" width="350" height="58" rx="14"/><rect x="535" y="360" width="350" height="58" rx="14"/><rect x="535" y="435" width="350" height="58" rx="14"/><rect x="535" y="510" width="350" height="58" rx="14"/><rect x="535" y="585" width="350" height="58" rx="14"/><rect x="535" y="660" width="350" height="58" rx="14"/></g>
    <g fill="#f3f7fb" font-size="16" font-weight="650"><text x="560" y="320">Owner profile &amp; skills</text><text x="560" y="395">Project registration</text><text x="560" y="470">Capability discovery</text><text x="560" y="545">Capability configuration</text><text x="560" y="620">Ownership routing &amp; review</text><text x="560" y="695">PR reconciliation</text></g>
    <path d="M920 455 C970 455 985 455 1030 455" stroke="#56d8e4" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)"><rect x="1030" y="210" width="310" height="490" rx="24" fill="#151728" stroke="#555384"/></g><text x="1060" y="250" fill="#bebcf5" font-size="14" font-weight="700" letter-spacing="2">NORMALIZED RESULT</text><text x="1060" y="292" fill="#f3f7fb" font-size="20" font-weight="700">owner-profile impacted</text>
    <text x="1060" y="338" fill="#9296b4" font-size="12" font-weight="700">EVIDENCE</text><rect x="1060" y="356" width="250" height="56" rx="12" fill="#1c2034"/><text x="1078" y="380" fill="#d8dcf3" font-size="13">route</text><text x="1078" y="400" fill="#9c9ed0" font-size="12">PUT /api/owner/profile</text><rect x="1060" y="428" width="250" height="56" rx="12" fill="#1c2034"/><text x="1078" y="452" fill="#d8dcf3" font-size="13">symbol</text><text x="1078" y="472" fill="#9c9ed0" font-size="12">PlatformStore.setSkills</text><rect x="1060" y="500" width="250" height="56" rx="12" fill="#1c2034"/><text x="1078" y="524" fill="#d8dcf3" font-size="13">path</text><text x="1078" y="544" fill="#9c9ed0" font-size="12">src/domain/owner-profile.ts</text>
    <line x1="1060" y1="590" x2="1310" y2="590" stroke="#30344d"/><text x="1060" y="622" fill="#83efbd" font-size="13" font-weight="700">deterministic first</text><text x="1060" y="646" fill="#9296b4" font-size="12">semantic evidence only when needed</text><text x="1060" y="670" fill="#9296b4" font-size="12">evidence survives into Owner review</text>
    <line x1="60" y1="805" x2="1340" y2="805" stroke="#1d2a38"/><text x="60" y="833" fill="#6f8092" font-size="12">Not REST ownership. Not folder ownership. Module ownership inferred from precise, composable evidence.</text>
  </g>
</svg>