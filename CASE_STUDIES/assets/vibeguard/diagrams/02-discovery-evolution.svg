<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<text x="40" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="780" fill="#10243E">VibeGuard — the product question moved upward</text>
<text x="40" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#687B96">Each prototype shape answered one useful question, then exposed a larger one.</text>

<rect x="40" y="112" width="1520" height="50" rx="13" fill="#FFFFFF" stroke="#D8E3EF"/>
<text x="58" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#6F56E8">DISCOVERY</text>
<text x="150" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="620" fill="#10243E">the implementation was a thinking tool; the discarded assumptions are part of the result</text>

<rect x="65" y="220" width="265" height="180" rx="18" fill="#FFFFFF" stroke="#5E7188" stroke-width="1.3"/>
<text x="90" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#5E7188">V0 · AI STUDIO</text>
<text x="90" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#10243E">Make it tangible</text>
<text x="90" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">Deliberately fast, vibe-coded</text>
<text x="90" y="348" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">prototype to explore the</text>
<text x="90" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">problem through interaction.</text>

<line x1="330" y1="310" x2="375" y2="310" stroke="#2F7BF6" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="390" y="220" width="265" height="180" rx="18" fill="#FFFFFF" stroke="#F08A00" stroke-width="1.3"/>
<text x="415" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#F08A00">V1 · HUMAN RESCUE</text>
<text x="415" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#10243E">Fix the fire</text>
<text x="415" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">AI audit + senior developer</text>
<text x="415" y="348" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">debugging marketplace /</text>
<text x="415" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">patch and resolution flow.</text>

<line x1="655" y1="310" x2="700" y2="310" stroke="#2F7BF6" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="715" y="220" width="265" height="180" rx="18" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.3"/>
<text x="740" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#2F7BF6">V2 · REVIEW LAYER</text>
<text x="740" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#10243E">Catch it earlier</text>
<text x="740" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">Repository context, structured</text>
<text x="740" y="348" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">findings, PR review, diff and</text>
<text x="740" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">guardrail experiments.</text>

<line x1="980" y1="310" x2="1025" y2="310" stroke="#2F7BF6" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="1040" y="220" width="265" height="180" rx="18" fill="#FFFFFF" stroke="#6F56E8" stroke-width="1.3"/>
<text x="1065" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#6F56E8">V3 · TECH OWNER</text>
<text x="1065" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#10243E">Own the boundary</text>
<text x="1065" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">Policy, evidence compression,</text>
<text x="1065" y="348" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">material escalation and</text>
<text x="1065" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">persistent human judgement.</text>

<line x1="1305" y1="310" x2="1350" y2="310" stroke="#2F7BF6" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="1365" y="220" width="170" height="180" rx="18" fill="#EAF9F4" stroke="#0FA978" stroke-width="1.3"/>
<text x="1450" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#0FA978" text-anchor="middle">PRODUCT THESIS</text>
<text x="1450" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#10243E" text-anchor="middle">Human</text>
<text x="1450" y="317" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#10243E" text-anchor="middle">ownership</text>
<text x="1450" y="342" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#10243E" text-anchor="middle">above agent</text>
<text x="1450" y="367" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#10243E" text-anchor="middle">execution</text>

<text x="65" y="475" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="760" fill="#10243E">What each version taught</text>

<rect x="65" y="510" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#D8E3EF"/>
<text x="90" y="545" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#10243E">Rescue is useful — but late</text>
<text x="90" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">A senior can fix the broken file while the</text>
<text x="90" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">system around it has already drifted.</text>
<text x="90" y="632" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#F08A00">→ intervene before the fire</text>

<rect x="430" y="510" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#D8E3EF"/>
<text x="455" y="545" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#10243E">Review is useful — but scoped</text>
<text x="455" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">A good PR can still be a locally correct</text>
<text x="455" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">implementation of the wrong architecture.</text>
<text x="455" y="632" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#2F7BF6">→ own the system, not only the diff</text>

<rect x="795" y="510" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#D8E3EF"/>
<text x="820" y="545" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#10243E">Approvals do not scale either</text>
<text x="820" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">If a human approves every action, AI has only</text>
<text x="820" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">moved the bottleneck into another UI.</text>
<text x="820" y="632" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#6F56E8">→ compress attention into decisions</text>

<rect x="1160" y="510" width="375" height="150" rx="16" fill="#FFFFFF" stroke="#0FA978"/>
<text x="1185" y="545" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#10243E">Decisions should teach the system</text>
<text x="1185" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">Repeated human judgement should become</text>
<text x="1185" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#687B96">policy, memory and future agent context.</text>
<text x="1185" y="632" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0FA978">→ reduce repeated interruption</text>

<rect x="65" y="710" width="1470" height="90" rx="16" fill="#10243E"/>
<text x="90" y="744" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#FFFFFF">The stable idea across all versions</text>
<text x="90" y="774" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#DDE6F1">AI-generated work should remain inspectable, context should survive escalation, and a human should stay authoritative where the remaining uncertainty is architectural, security-sensitive or irreversible.</text>
</svg>