<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<text x="40" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="780" fill="#10243E">VibeGuard — from coding agents to a new engineering model</text>
<text x="40" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#687B96">The differentiator is no longer whether an LLM can write code; it is whether AI-heavy delivery stays evolvable, refactorable and sellable over time.</text>

<rect x="40" y="112" width="1520" height="50" rx="13" fill="#FFFFFF" stroke="#D8E3EF"/>
<text x="58" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#6F56E8">ENGINEERING THESIS</text>
<text x="205" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="620" fill="#10243E">models, skills and plugins increase local capability; the harder problem is preserving system-level coherence across years of change</text>

<rect x="65" y="215" width="410" height="390" rx="20" fill="#FFFFFF" stroke="#2F7BF6" stroke-width="1.5"/>
<text x="95" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#2F7BF6">COMMODITIZING LAYER</text>
<text x="95" y="295" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="760" fill="#10243E">Make AI code better / faster</text>
<text x="95" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• better coding model</text>
<text x="95" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• more tools / MCP / plugins</text>
<text x="95" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• better prompts / skills / workflows</text>
<text x="95" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• faster local implementation</text>
<text x="95" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• more parallel agent work</text>
<rect x="95" y="535" width="320" height="46" rx="11" fill="#EAF2FF" stroke="#2F7BF6"/>
<text x="255" y="564" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#2F7BF6">LOCAL IMPLEMENTATION CAPABILITY</text>

<line x1="475" y1="410" x2="545" y2="410" stroke="#F08A00" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="560" y="215" width="450" height="390" rx="20" fill="#FFFFFF" stroke="#F08A00" stroke-width="1.6"/>
<text x="590" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#F08A00">THE REAL SCALING PROBLEM</text>
<text x="590" y="295" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="760" fill="#10243E">Keep the system healthy after year one</text>
<text x="590" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• changing business requirements</text>
<text x="590" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• large refactors without concept drift</text>
<text x="590" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• architecture simplification over time</text>
<text x="590" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• security / debt / migration sanity</text>
<text x="590" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• preserving why decisions were made</text>
<rect x="590" y="535" width="360" height="46" rx="11" fill="#FFF3E4" stroke="#F08A00"/>
<text x="770" y="564" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#F08A00">SYSTEM EVOLVABILITY &amp; CONTINUITY</text>

<line x1="1010" y1="410" x2="1080" y2="410" stroke="#6F56E8" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="1095" y="215" width="440" height="390" rx="20" fill="#FFFFFF" stroke="#6F56E8" stroke-width="1.6"/>
<text x="1125" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#6F56E8">NEW ENGINEERING MODEL</text>
<text x="1125" y="295" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="760" fill="#10243E">Delegate execution, preserve ownership</text>
<text x="1125" y="345" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• explicit policy + architecture intent</text>
<text x="1125" y="380" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• bounded autonomous implementation</text>
<text x="1125" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• evidence-driven selective escalation</text>
<text x="1125" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• battle-tested Tech Owner judgement</text>
<text x="1125" y="485" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687B96">• auditable technical accountability</text>
<rect x="1125" y="535" width="350" height="46" rx="11" fill="#F2EEFF" stroke="#6F56E8"/>
<text x="1300" y="564" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#6F56E8">SCALABLE AGENTIC ENGINEERING</text>

<rect x="65" y="675" width="1470" height="110" rx="18" fill="#10243E"/>
<text x="90" y="711" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#FFFFFF">The end goal is not merely software that agents can produce — it is software a team can keep changing, refactoring, operating and confidently sell.</text>
<text x="90" y="743" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#DDE6F1">That requires a workflow in which automation absorbs safe execution while experienced engineers remain accountable for system-level coherence, risk and the decisions that redefine the product.</text>
</svg>