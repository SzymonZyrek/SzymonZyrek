<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="900" fill="#F5F8FC"/>
<text x="40" y="58" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="780" fill="#10243E">VibeGuard — Tech Owner control loop</text>
<text x="40" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="450" fill="#687B96">Agents execute inside explicit boundaries; human judgement is reserved for material uncertainty.</text>

<rect x="40" y="112" width="1520" height="50" rx="13" fill="#FFFFFF" stroke="#D8E3EF"/>
<text x="58" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#6F56E8">CONTROL LOOP</text>
<text x="170" y="143" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="620" fill="#10243E">maximize autonomous delivery without silently delegating architecture, security or irreversible decisions</text>

<rect x="80" y="235" width="260" height="120" rx="16" fill="#F2EEFF" stroke="#6F56E8" stroke-width="1.4"/>
<text x="210" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#6F56E8" text-anchor="middle">Project Policy</text>
<text x="210" y="303" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">invariants · security · approval</text>
<text x="210" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">boundaries · autonomy mode</text>

<line x1="340" y1="295" x2="410" y2="295" stroke="#2F7BF6" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="425" y="235" width="260" height="120" rx="16" fill="#EAF2FF" stroke="#2F7BF6" stroke-width="1.4"/>
<text x="555" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#2F7BF6" text-anchor="middle">Agent Execution</text>
<text x="555" y="303" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">implement · refactor · test</text>
<text x="555" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">iterate on feedback autonomously</text>

<line x1="685" y1="295" x2="755" y2="295" stroke="#2F7BF6" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="770" y="235" width="300" height="120" rx="16" fill="#FFFFFF" stroke="#0FA978" stroke-width="1.4"/>
<text x="920" y="274" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#0FA978" text-anchor="middle">Evidence Layer</text>
<text x="920" y="303" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">tests · CI · security · static analysis</text>
<text x="920" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">AI review · repository context</text>

<line x1="1070" y1="295" x2="1135" y2="295" stroke="#0FA978" stroke-width="3" marker-end="url(#arrow)"/>

<polygon points="1245,220 1375,295 1245,370 1115,295" fill="#FFF3E4" stroke="#F08A00" stroke-width="1.5"/>
<text x="1245" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#10243E" text-anchor="middle">Material boundary</text>
<text x="1245" y="308" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="760" fill="#10243E" text-anchor="middle">crossed?</text>

<line x1="1245" y1="370" x2="1245" y2="445" stroke="#E64B5D" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1260" y="414" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#E64B5D">YES</text>

<rect x="1095" y="460" width="300" height="120" rx="16" fill="#FFF0F2" stroke="#E64B5D" stroke-width="1.5"/>
<text x="1245" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#E64B5D" text-anchor="middle">Owner Inbox</text>
<text x="1245" y="529" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">compressed change + evidence +</text>
<text x="1245" y="551" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">why human judgement is needed</text>

<line x1="1095" y1="520" x2="1000" y2="520" stroke="#E64B5D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="680" y="455" width="305" height="130" rx="16" fill="#F2EEFF" stroke="#6F56E8" stroke-width="1.5"/>
<text x="832" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#6F56E8" text-anchor="middle">Tech Owner Decision</text>
<text x="832" y="524" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">approve · request change</text>
<text x="832" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">exception · update policy</text>

<line x1="680" y1="520" x2="585" y2="520" stroke="#6F56E8" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="250" y="455" width="320" height="130" rx="16" fill="#EAF9F4" stroke="#0FA978" stroke-width="1.5"/>
<text x="410" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="760" fill="#0FA978" text-anchor="middle">Decision Memory</text>
<text x="410" y="524" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">rationale · ADR · exception</text>
<text x="410" y="546" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#687B96" text-anchor="middle">future agent / policy context</text>

<path d="M410 455 C410 405, 210 405, 210 355" fill="none" stroke="#0FA978" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M410 585 C410 655, 555 655, 555 365" fill="none" stroke="#0FA978" stroke-width="3" marker-end="url(#arrow)"/>

<path d="M1375 295 C1490 295,1490 180,555 180 C500 180,500 210,500 225" fill="none" stroke="#2F7BF6" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1402" y="276" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#2F7BF6">NO</text>
<text x="905" y="171" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#2F7BF6" text-anchor="middle">routine change continues without consuming human attention</text>

<rect x="65" y="670" width="1470" height="100" rx="17" fill="#10243E"/>
<text x="90" y="707" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="760" fill="#FFFFFF">The design target is selective interruption, not universal approval.</text>
<text x="90" y="738" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#DDE6F1">Every resolved decision should either authorize the current change, reject it with actionable direction, or improve future policy so the same question costs less human attention next time.</text>
</svg>